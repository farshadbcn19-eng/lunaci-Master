name: EMERGENCY - restore corrupted Elementor design data (guarded write)

on:
  push:
    branches:
      - claude/lunaci-barcelona-audit-r9mp7s
    paths:
      - '.github/workflows/EMERGENCY-restore-elementor-data.yml'

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Restore _elementor_data on posts 57, 59, 61, 680 from last valid revision, reapply legitimate fixes with correct wp_slash() handling
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then
                 WP_PATH="$candidate";
                 break;
               fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then WP_PATH=$(dirname "$FOUND"); fi;
             fi;
             if [ -z "$WP_PATH" ]; then echo "ERROR: could not locate wp-config.php"; exit 1; fi;
             echo "WordPress found at: $WP_PATH";

             echo "" | base64 -d > /tmp/restore-elementor-data.php;

             php -l /tmp/restore-elementor-data.php;
             LINT_STATUS=$?;
             if [ "$LINT_STATUS" -ne 0 ]; then
               echo "ABORT: php -l failed";
               rm -f /tmp/restore-elementor-data.php;
               exit 1;
             fi;

             wp eval-file /tmp/restore-elementor-data.php --path="$WP_PATH";
             EVAL_STATUS=$?;
             rm -f /tmp/restore-elementor-data.php;
             if [ "$EVAL_STATUS" -ne 0 ]; then
               echo "FAIL: wp eval-file failed (exit code $EVAL_STATUS)";
               exit 1;
             fi;
             echo "workflow finished (check per-post output above for actual restore status)"'

      - name: Purge LiteSpeed cache so the fixed pages serve immediately
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then WP_PATH="$candidate"; break; fi;
             done;
             if [ -n "$WP_PATH" ]; then
               wp litespeed-purge all --path="$WP_PATH" 2>&1 || echo "litespeed-purge command not available, skipping (not fatal)";
             fi'

      - name: Live verification
        run: |
          echo "--- homepage ---"
          curl -sL https://lunacibarcelona.com/ | grep -o 'ln-nav' | head -1 || echo "ln-nav NOT FOUND"
          curl -sL https://lunacibarcelona.com/ | grep -c '<style' || true
          echo "--- about ---"
          curl -sL https://lunacibarcelona.com/about | grep -o 'ln-nav\|lna-nav' | head -1 || echo "custom nav class NOT FOUND"
          echo "--- products ---"
          curl -sL https://lunacibarcelona.com/products/ | grep -o 'ln-nav\|lna-nav' | head -1 || echo "custom nav class NOT FOUND"
