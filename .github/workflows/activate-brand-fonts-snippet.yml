name: Activate LUNACI Brand Fonts snippet (guarded write)

on:
  workflow_dispatch:

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: STEP A/B/C activate snippet id=9, verify live output, purge cache
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then
                 WP_PATH="$candidate";
                 break;
               fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" \
                 -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then
                 WP_PATH=$(dirname "$FOUND");
               fi;
             fi;
             if [ -z "$WP_PATH" ]; then
               echo "ERROR: could not locate wp-config.php under $HOME";
               exit 1;
             fi;
             echo "WordPress found at: $WP_PATH";

             echo "" | base64 -d > /tmp/activate-brand-fonts-snippet.php;

             php -l /tmp/activate-brand-fonts-snippet.php;
             LINT_STATUS=$?;
             if [ "$LINT_STATUS" -ne 0 ]; then
               echo "ABORT: php -l failed on script";
               rm -f /tmp/activate-brand-fonts-snippet.php;
               exit 1;
             fi;

             wp eval-file /tmp/activate-brand-fonts-snippet.php --path="$WP_PATH";
             EVAL_STATUS=$?;
             rm -f /tmp/activate-brand-fonts-snippet.php;
             if [ "$EVAL_STATUS" -ne 0 ]; then
               echo "ABORT: wp eval-file failed (exit code $EVAL_STATUS) - activation did NOT complete successfully, see log above";
               exit 1;
             fi;

             echo "";
             echo "====================================================================";
             echo "STEP C EXTRA: fetch live homepage HTML and check for lunaci-brand-fonts-css";
             echo "====================================================================";
             HOMEPAGE_HTML=$(curl -s --connect-timeout 10 --max-time 20 -H "Cache-Control: no-cache" "https://lunacibarcelona.com/?nocache=$(date +%s)");
             MATCH_LINES=$(echo "$HOMEPAGE_HTML" | grep -i "lunaci-brand-fonts-css");
             if [ -n "$MATCH_LINES" ]; then
               echo "FOUND: lunaci-brand-fonts-css is present in the live homepage HTML:";
               echo "$MATCH_LINES";
             else
               echo "NOT FOUND: lunaci-brand-fonts-css was not found in the live homepage HTML.";
               echo "This is NOT treated as a hard failure - the DB update above already verified active=1.";
               echo "A caching layer (LiteSpeed page cache, CDN, browser cache) may be serving a stale pre-activation page.";
               echo "The cache purge below should resolve this; re-check the live page manually afterward if this note persists.";
             fi;

             echo "";
             echo "====================================================================";
             echo "Purge cache";
             echo "====================================================================";
             wp litespeed-purge all --path="$WP_PATH";
             PURGE_STATUS=$?;
             if [ "$PURGE_STATUS" -ne 0 ]; then
               echo "litespeed-purge failed (status=$PURGE_STATUS), falling back to wp cache flush";
               wp cache flush --path="$WP_PATH";
             fi;

             echo "OK: activation workflow completed"'
