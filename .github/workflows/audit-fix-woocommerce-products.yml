name: Audit ghost products + fix Stage 1 pricing for 6 WooCommerce products

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: PART A audit (read-only) + PART B guarded Stage 1 pricing/publish (write)
        run: |
          sshpass -p "${{ secrets.HOSTINGER_SSH_PASS }}" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p ${{ secrets.HOSTINGER_SSH_PORT }} \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then
                 WP_PATH="$candidate";
                 break;
               fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" \
                 -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then
                 WP_PATH=$(dirname "$FOUND");
               fi;
             fi;
             if [ -z "$WP_PATH" ]; then
               echo "ERROR: could not locate wp-config.php under $HOME";
               exit 1;
             fi;
             echo "WordPress found at: $WP_PATH";

             echo "" | base64 -d > /tmp/audit-fix-woocommerce-products.php;

             php -l /tmp/audit-fix-woocommerce-products.php;
             LINT_STATUS=$?;
             if [ "$LINT_STATUS" -ne 0 ]; then
               echo "ABORT: php -l failed on script";
               rm -f /tmp/audit-fix-woocommerce-products.php;
               exit 1;
             fi;

             wp eval-file /tmp/audit-fix-woocommerce-products.php --path="$WP_PATH";
             EVAL_STATUS=$?;
             rm -f /tmp/audit-fix-woocommerce-products.php;
             if [ "$EVAL_STATUS" -ne 0 ]; then
               echo "ABORT: wp eval-file failed (exit code $EVAL_STATUS) - PART B did NOT complete successfully, see log above";
               exit 1;
             fi;

             wp litespeed-purge all --path="$WP_PATH";
             PURGE_STATUS=$?;
             if [ "$PURGE_STATUS" -ne 0 ]; then
               echo "litespeed-purge failed (status=$PURGE_STATUS), falling back to wp cache flush";
               wp cache flush --path="$WP_PATH";
             fi;

             echo "OK: audit + Stage 1 pricing/publish workflow completed successfully"'
