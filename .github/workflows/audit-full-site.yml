name: Full Site Audit (read-only)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/lunaci-barcelona-audit-r9mp7s
    paths:
      - '.github/workflows/audit-full-site.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Full site crawl - links, images, bilingual pairs, design regressions
        shell: bash
        run: |
          set +e
          set +o pipefail
          SITE="https://lunacibarcelona.com"
          UA="Mozilla/5.0 (LunaciAudit/1.0)"
          GETOPTS=(-sL --max-time 25 --retry 1 -A "$UA")
          HEADOPTS=(-sI -L --max-time 20 --retry 1 -A "$UA")

          fetch() { curl "${GETOPTS[@]}" "$1" 2>/dev/null; }
          head_status() { curl "${HEADOPTS[@]}" -o /dev/null -w '%{http_code}' "$1" 2>/dev/null; }

          echo "===== 1. DISCOVER URL LIST FROM SITEMAP ====="
          urls_file=$(mktemp)
          : > "$urls_file"

          for candidate in "$SITE/sitemap_index.xml" "$SITE/sitemap.xml" "$SITE/wp-sitemap.xml"; do
            body=$(fetch "$candidate")
            match=$(printf '%s' "$body" | grep -c "<loc>")
            if [ "${match:-0}" -gt 0 ]; then
              printf '%s' "$body" | grep -oP '(?<=<loc>)[^<]+' >> "$urls_file"
              echo "AUDIT_INFO|sitemap source: $candidate ($match locs)"
              break
            fi
          done

          if [ ! -s "$urls_file" ]; then
            echo "AUDIT_FATAL|no sitemap found at sitemap_index.xml, sitemap.xml, or wp-sitemap.xml"
            exit 0
          fi

          # Expand one level if the top-level file was a sitemap index (entries ending in .xml)
          sub_sitemaps=$(grep -E '\.xml$' "$urls_file")
          if [ -n "$sub_sitemaps" ]; then
            : > "$urls_file"
            while IFS= read -r sm; do
              [ -z "$sm" ] && continue
              case "$sm" in *image-sitemap*|*author-sitemap*) continue;; esac
              body=$(fetch "$sm")
              printf '%s' "$body" | grep -oP '(?<=<loc>)[^<]+' >> "$urls_file"
            done <<< "$sub_sitemaps"
          fi

          sort -u -o "$urls_file" "$urls_file"
          grep -viE '\.(xml|jpg|jpeg|png|webp|pdf)$' "$urls_file" > "${urls_file}.clean"
          mv "${urls_file}.clean" "$urls_file"
          TOTAL_URLS=$(wc -l < "$urls_file")
          echo "AUDIT_INFO|discovered $TOTAL_URLS content URLs from sitemap"
          echo "--- URL LIST ---"
          cat "$urls_file"
          echo "--- END URL LIST ---"

          checked_links_file=$(mktemp)
          checked_imgs_file=$(mktemp)
          : > "$checked_links_file"
          : > "$checked_imgs_file"
          broken_links=0
          broken_imgs=0
          missing_dims=0
          bilingual_missing=0
          bilingual_broken=0
          design_issues=0
          forbidden_word_hits=0
          page_count=0

          FORBIDDEN_WORDS='flawless|revolutionary|\bperfect\b|\bbest\b|darling|\bbabe\b|gorgeous|hide your flaws'

          while IFS= read -r page_url; do
            [ -z "$page_url" ] && continue
            page_count=$((page_count + 1))

            status=$(head_status "$page_url")
            [ -z "$status" ] && status="000"
            if [ "$status" != "200" ]; then
              echo "PAGE_BROKEN|$page_url|status=$status"
              broken_links=$((broken_links + 1))
              continue
            fi

            html=$(fetch "$page_url")
            if [ -z "$html" ]; then
              echo "PAGE_EMPTY|$page_url"
              continue
            fi

            echo "===== PAGE $page_url ====="

            hrefs=$(printf '%s' "$html" | grep -oP '(?<=href=")[^"]+' | sort -u)
            while IFS= read -r href; do
              [ -z "$href" ] && continue
              case "$href" in
                mailto:*|tel:*|javascript:*|\#*) continue ;;
                /*) full="$SITE$href" ;;
                http*) full="$href" ;;
                *) continue ;;
              esac
              full="${full%%#*}"
              [ -z "$full" ] && continue
              case "$full" in
                *lunacibarcelona.com*) : ;;
                *) continue ;;
              esac
              if grep -qxF "$full" "$checked_links_file" 2>/dev/null; then continue; fi
              echo "$full" >> "$checked_links_file"
              lstatus=$(head_status "$full")
              [ -z "$lstatus" ] && lstatus="000"
              if [ "$lstatus" != "200" ]; then
                echo "LINK_BROKEN|on_page=$page_url|target=$full|status=$lstatus"
                broken_links=$((broken_links + 1))
              fi
            done <<< "$hrefs"

            imgtags=$(printf '%s' "$html" | grep -oP '<img[^>]+>')
            while IFS= read -r imgtag; do
              [ -z "$imgtag" ] && continue
              src=$(printf '%s' "$imgtag" | grep -oP '(?<=src=")[^"]+' | head -1)
              [ -z "$src" ] && src=$(printf '%s' "$imgtag" | grep -oP '(?<=data-src=")[^"]+' | head -1)
              [ -z "$src" ] && continue
              case "$src" in
                /*) fullimg="$SITE$src" ;;
                http*) fullimg="$src" ;;
                *) continue ;;
              esac
              has_w=$(printf '%s' "$imgtag" | grep -oP 'width="[0-9]+"')
              has_h=$(printf '%s' "$imgtag" | grep -oP 'height="[0-9]+"')
              if [ -z "$has_w" ] || [ -z "$has_h" ]; then
                echo "IMG_MISSING_DIMENSIONS|on_page=$page_url|img=$fullimg"
                missing_dims=$((missing_dims + 1))
              fi
              if ! grep -qxF "$fullimg" "$checked_imgs_file" 2>/dev/null; then
                echo "$fullimg" >> "$checked_imgs_file"
                istatus=$(head_status "$fullimg")
                [ -z "$istatus" ] && istatus="000"
                if [ "$istatus" != "200" ]; then
                  echo "IMG_BROKEN|on_page=$page_url|img=$fullimg|status=$istatus"
                  broken_imgs=$((broken_imgs + 1))
                fi
              fi
            done <<< "$imgtags"

            es_href=$(printf '%s' "$html" | grep -oP 'hreflang="es"[^>]*href="[^"]+"|href="[^"]+"[^>]*hreflang="es"' | grep -oP '(?<=href=")[^"]+' | head -1)
            case "$page_url" in
              */es/*|*lang=es*)
                : # this is already a spanish-language URL, skip pair check
                ;;
              *)
                if [ -z "$es_href" ]; then
                  echo "BILINGUAL_MISSING|page=$page_url|no hreflang es alternate found"
                  bilingual_missing=$((bilingual_missing + 1))
                else
                  estatus=$(head_status "$es_href")
                  [ -z "$estatus" ] && estatus="000"
                  if [ "$estatus" != "200" ]; then
                    echo "BILINGUAL_BROKEN|page=$page_url|es_target=$es_href|status=$estatus"
                    bilingual_broken=$((bilingual_broken + 1))
                  fi
                fi
                ;;
            esac

            white_bg=$(printf '%s' "$html" | grep -oiE 'background(-color)?\s*:\s*(#fff(fff)?|white)\b' | sort -u | head -5 | tr '\n' ';')
            if [ -n "$white_bg" ]; then
              echo "DESIGN_WHITE_BG|page=$page_url|matches=$white_bg"
              design_issues=$((design_issues + 1))
            fi

            visible_text=$(printf '%s' "$html" | sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<style[^>]*>.*<\/style>//g' -e 's/<[^>]*>/ /g')
            hit=$(printf '%s' "$visible_text" | grep -oiE "$FORBIDDEN_WORDS" | sort -u | tr '\n' ',')
            if [ -n "$hit" ]; then
              echo "FORBIDDEN_WORD|page=$page_url|words=$hit"
              forbidden_word_hits=$((forbidden_word_hits + 1))
            fi

            excl=$(printf '%s' "$visible_text" | grep -ocE '!!+')
            if [ "${excl:-0}" != "0" ]; then
              echo "DESIGN_MULTI_EXCLAMATION|page=$page_url|count=$excl"
              design_issues=$((design_issues + 1))
            fi

          done < "$urls_file"

          echo "===== AUDIT SUMMARY ====="
          echo "AUDIT_SUMMARY|pages_checked=$page_count|broken_links=$broken_links|broken_images=$broken_imgs|images_missing_dimensions=$missing_dims|bilingual_missing=$bilingual_missing|bilingual_broken=$bilingual_broken|design_issues=$design_issues|forbidden_word_hits=$forbidden_word_hits"
          exit 0
