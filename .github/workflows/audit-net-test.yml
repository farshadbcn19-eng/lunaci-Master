name: Audit Net Test (diagnostic)

on:
  push:
    branches:
      - claude/lunaci-barcelona-audit-r9mp7s
    paths:
      - '.github/workflows/audit-net-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Debug sitemap extraction
        shell: bash
        run: |
          set +e
          set +o pipefail
          SITE="https://lunacibarcelona.com"
          UA="Mozilla/5.0 (LunaciAudit/1.0)"
          GETOPTS=(-sL --max-time 25 --retry 1 -A "$UA")
          body=$(curl "${GETOPTS[@]}" "$SITE/sitemap_index.xml" 2>/dev/null)
          echo "body byte length: ${#body}"
          echo "--- RAW BODY (first 2000 chars) ---"
          printf '%s' "$body" | head -c 2000
          echo ""
          echo "--- END RAW BODY ---"
          echo "--- grep -c <loc> ---"
          printf '%s' "$body" | grep -c "<loc>"
          echo "--- grep -oP lookbehind result ---"
          printf '%s' "$body" | grep -oP '(?<=<loc>)[^<]+'
          echo "--- line count of body ---"
          printf '%s' "$body" | wc -l
