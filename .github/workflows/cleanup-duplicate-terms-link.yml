name: Cleanup Duplicate Terms of Service Link

on:
  workflow_dispatch:

jobs:
  cleanup-elementor-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -y && sudo apt-get install -y sshpass

      - name: Collapse duplicated Terms of Service link on post_ids 57, 59, 61 only
        run: |
          set -o pipefail
          sshpass -p "${{ secrets.HOSTINGER_SSH_PASS }}" ssh -o StrictHostKeyChecking=no \
            -p ${{ secrets.HOSTINGER_SSH_PORT }} \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then
                 WP_PATH="$candidate";
                 break;
               fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" \
                 -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then
                 WP_PATH=$(dirname "$FOUND");
               fi;
             fi;
             if [ -z "$WP_PATH" ]; then
               echo "ERROR: could not locate wp-config.php under $HOME";
               exit 1;
             fi;
             echo "WordPress found at: $WP_PATH";
             echo "" | base64 -d > /tmp/cleanup-duplicate-terms-link.php;
             php -l /tmp/cleanup-duplicate-terms-link.php;
             LINT_STATUS=$?;
             if [ "$LINT_STATUS" -ne 0 ]; then
               echo "ABORT: php -l failed on cleanup script";
               rm -f /tmp/cleanup-duplicate-terms-link.php;
               exit 1;
             fi;
             wp eval-file /tmp/cleanup-duplicate-terms-link.php --path="$WP_PATH";
             EVAL_STATUS=$?;
             rm -f /tmp/cleanup-duplicate-terms-link.php;
             if [ "$EVAL_STATUS" -ne 0 ]; then
               echo "ABORT: wp eval-file failed (exit code $EVAL_STATUS) - cleanup did NOT complete successfully";
               exit 1;
             fi' | tee cleanup-output.txt

      - name: Write job summary
        if: always()
        run: |
          set -o pipefail
          echo "## Duplicate Terms of Service link cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat cleanup-output.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no output captured)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
