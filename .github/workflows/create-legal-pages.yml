name: Create Legal Pages (Privacy Policy + Terms of Service)

on:
  workflow_dispatch:

jobs:
  create-legal-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -y && sudo apt-get install -y sshpass

      - name: Upload legal-pages PHP script to remote /tmp
        run: |
          sshpass -p "${{ secrets.HOSTINGER_SSH_PASS }}" ssh -o StrictHostKeyChecking=no \
            -p ${{ secrets.HOSTINGER_SSH_PORT }} \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} \
            'echo "" | base64 -d > /tmp/lunaci-legal-pages.php;
             wc -c /tmp/lunaci-legal-pages.php;
             php -l /tmp/lunaci-legal-pages.php'

      - name: Create/update Privacy Policy and Terms of Service pages, patch footer
        run: |
          sshpass -p "${{ secrets.HOSTINGER_SSH_PASS }}" ssh -o StrictHostKeyChecking=no \
            -p ${{ secrets.HOSTINGER_SSH_PORT }} \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then
                 WP_PATH="$candidate";
                 break;
               fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" \
                 -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then
                 WP_PATH=$(dirname "$FOUND");
               fi;
             fi;
             if [ -z "$WP_PATH" ]; then
               echo "ERROR: could not locate wp-config.php under $HOME";
               rm -f /tmp/lunaci-legal-pages.php;
               exit 1;
             fi;
             echo "WordPress found at: $WP_PATH";
             wp eval-file /tmp/lunaci-legal-pages.php --path="$WP_PATH";
             EVAL_STATUS=$?;
             rm -f /tmp/lunaci-legal-pages.php;
             if [ "$EVAL_STATUS" -ne 0 ]; then
               echo "ABORT: wp eval-file failed (exit code $EVAL_STATUS) - page creation/footer patch did NOT complete successfully";
               exit 1;
             fi;
             echo "--- Verification (page listing) ---";
             wp post list --post_type=page --field=ID --name=privacy-policy --path="$WP_PATH";
             wp post list --post_type=page --field=ID --name=terms-of-service --path="$WP_PATH"'

      - name: Live curl verification
        run: |
          echo "## Live verification" >> "$GITHUB_STEP_SUMMARY"
          PRIVACY_CODE=$(curl -sgL -o /dev/null -w "%{http_code}" https://lunacibarcelona.com/privacy-policy)
          TERMS_CODE=$(curl -sgL -o /dev/null -w "%{http_code}" https://lunacibarcelona.com/terms-of-service)
          echo "- https://lunacibarcelona.com/privacy-policy -> HTTP $PRIVACY_CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- https://lunacibarcelona.com/terms-of-service -> HTTP $TERMS_CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "privacy-policy: HTTP $PRIVACY_CODE"
          echo "terms-of-service: HTTP $TERMS_CODE"
          if [ "$PRIVACY_CODE" != "200" ] || [ "$TERMS_CODE" != "200" ]; then
            echo "FAIL: one or both pages did not return HTTP 200" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "OK: both pages returned HTTP 200" >> "$GITHUB_STEP_SUMMARY"
