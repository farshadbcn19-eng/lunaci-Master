name: Create Shipping and Returns pages (guarded write)

on:
  push:
    branches:
      - claude/lunaci-barcelona-audit-r9mp7s
    paths:
      - '.github/workflows/create-shipping-returns-pages.yml'

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Create Shipping and Returns pages (user-approved copy)
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then
                 WP_PATH="$candidate";
                 break;
               fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then WP_PATH=$(dirname "$FOUND"); fi;
             fi;
             if [ -z "$WP_PATH" ]; then echo "ERROR: could not locate wp-config.php"; exit 1; fi;
             echo "WordPress found at: $WP_PATH";

             echo "" | base64 -d > /tmp/create-shipping-returns-pages.php;

             php -l /tmp/create-shipping-returns-pages.php;
             LINT_STATUS=$?;
             if [ "$LINT_STATUS" -ne 0 ]; then
               echo "ABORT: php -l failed";
               rm -f /tmp/create-shipping-returns-pages.php;
               exit 1;
             fi;

             wp eval-file /tmp/create-shipping-returns-pages.php --path="$WP_PATH" > /tmp/create-output.txt 2>&1;
             EVAL_STATUS=$?;
             cat /tmp/create-output.txt;
             HAS_ABORT=$(grep -c "ABORT:" /tmp/create-output.txt || true);
             rm -f /tmp/create-shipping-returns-pages.php /tmp/create-output.txt;
             if [ "$EVAL_STATUS" -ne 0 ]; then
               echo "FAIL: wp eval-file failed (exit code $EVAL_STATUS)";
               exit 1;
             fi;
             if [ "${HAS_ABORT:-0}" != "0" ]; then
               echo "FAIL: script reported ABORT - see log above";
               exit 1;
             fi;
             echo "OK: pages created"'

      - name: Live verification
        run: |
          SHIPPING_CODE=$(curl -sgL -o /dev/null -w "%{http_code}" https://lunacibarcelona.com/shipping)
          RETURNS_CODE=$(curl -sgL -o /dev/null -w "%{http_code}" https://lunacibarcelona.com/returns)
          echo "shipping: HTTP $SHIPPING_CODE"
          echo "returns: HTTP $RETURNS_CODE"
          if [ "$SHIPPING_CODE" != "200" ] || [ "$RETURNS_CODE" != "200" ]; then
            echo "FAIL: one or both pages did not return HTTP 200"
            exit 1
          fi
          echo "OK: both pages returned HTTP 200"
