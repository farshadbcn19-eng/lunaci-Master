name: Debug3 - Terms/Privacy with direct-to-disk logging

on:
  push:
    branches:
      - claude/lunaci-barcelona-audit-r9mp7s
    paths:
      - '.github/workflows/debug3-terms-privacy.yml'

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Transfer scripts
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          for f in create-es-3-terms create-es-4-privacy; do
            sshpass -e scp -o StrictHostKeyChecking=no -P "$SSH_PORT" \
              "assets/translations/$f.php" "$SSH_USER@$SSH_HOST:/tmp/$f.php"
          done

      - name: Run with disk logging fallback
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then WP_PATH="$candidate"; break; fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then WP_PATH=$(dirname "$FOUND"); fi;
             fi;
             if [ -z "$WP_PATH" ]; then echo "ERROR: could not locate wp-config.php"; exit 1; fi;
             rm -f /tmp/log-terms.txt /tmp/log-privacy.txt;
             for f in create-es-3-terms create-es-4-privacy; do
               echo "=== $f ===";
               wp eval-file /tmp/$f.php --path="$WP_PATH" > /tmp/$f-out.txt 2>&1;
               echo "exit=$?";
               echo "--- stdout-captured ---";
               cat /tmp/$f-out.txt;
               echo "--- disk log ---";
               cat /tmp/log-terms.txt 2>/dev/null;
               cat /tmp/log-privacy.txt 2>/dev/null;
               echo "";
               rm -f /tmp/$f.php /tmp/$f-out.txt;
             done;
             php -v;
             php -i | grep -iE "memory_limit|max_execution_time|opcache.enable"'
