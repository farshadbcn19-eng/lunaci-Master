name: "Accessibility fixes: cart label, contrast CSS, skip target, favicon (dry-run / apply / rollback)"

# Runs assets/luna-import/a11y-fixes.php and deploys lunaci-seo.php (items
# 13 skip-link target, 14 favicon links) plus the favicon files:
#   dry-run  - preconditions only; lunaci-seo.php is deployed (items 13 and 14
#              are harmless without the files: the links only appear in head)
#   apply    - full backup first; English cart aria-label in snippet 8; new
#              WPCode CSS snippet (contrast, not on the home page); favicon
#              files in the web root; purge; live checks
#   rollback - restores snippet 8, deletes the WPCode snippet and the favicon
#              files added by apply

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run, apply, rollback or update-css"
        required: true
        default: "dry-run"
        type: choice
        options: ["dry-run", "apply", "rollback", "update-css"]

# One Hostinger deploy at a time: overlapping runs share /tmp files on the server.
concurrency:
  group: lunaci-hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_PASS: ${{ secrets.HOSTINGER_LUNACI_SSH_PASS }}
      SSH_PORT: ${{ secrets.HOSTINGER_LUNACI_SSH_PORT }}
      SSH_USER: ${{ secrets.HOSTINGER_LUNACI_SSH_USER }}
      SSH_HOST: ${{ secrets.HOSTINGER_LUNACI_SSH_HOST }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Run (with full backup before apply)
        run: |
          set -e
          case "$MODE" in dry-run|apply|rollback|update-css) ;; *) echo "bad mode $MODE"; exit 1;; esac
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'rm -rf /tmp/a11y-fixes && mkdir -p /tmp/a11y-fixes'
          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -o ConnectTimeout=15 -P "$SSH_PORT" \
            "scripts/db-backup.php" "assets/luna-import/a11y-fixes.php" "mu-plugins/lunaci-seo.php" \
            "assets/favicon/favicon.ico" "assets/favicon/lunaci-icon-192.png" "assets/favicon/lunaci-apple-touch-icon.png" \
            "$SSH_USER@$SSH_HOST:/tmp/a11y-fixes/"
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "MODE=$MODE"' bash -s' <<'REMOTE'
            set -e
            T=/tmp/a11y-fixes
            WP_PATH="";
            for c in "$HOME/public_html" "$HOME" "$(pwd)"; do [ -f "$c/wp-config.php" ] && { WP_PATH="$c"; break; }; done;
            [ -z "$WP_PATH" ] && WP_PATH=$(dirname "$(find -L "$HOME" -maxdepth 8 -name wp-config.php -not -path "*/wp-content/*" 2>/dev/null | head -1)");
            php -l $T/a11y-fixes.php
            php -l $T/lunaci-seo.php
            if [ "$MODE" = "rollback" ]; then
              BK=$(cat "$HOME/lunaci-backups/LATEST-a11y-fixes" 2>/dev/null || true)
              [ -n "$BK" ] && [ -f "$BK/a11y-fixes-backup.json" ] || { echo "ABORT: no apply backup found"; exit 1; }
            elif [ "$MODE" = "update-css" ]; then
              BK=$(cat "$HOME/lunaci-backups/LATEST-a11y-fixes" 2>/dev/null || true)
              [ -n "$BK" ] && [ -d "$BK" ] || { echo "ABORT: no apply backup dir"; exit 1; }
              php -l $T/db-backup.php
              LUNACI_BACKUP_FILE="$BK/database-before-update-css-$(date -u +%Y%m%d-%H%M%S).sql.gz" wp eval-file $T/db-backup.php --path="$WP_PATH" || { echo "ABORT: database backup failed"; exit 1; }
              echo "BACKUP OK (update-css): $BK"
            elif [ "$MODE" = "apply" ]; then
              BK="$HOME/lunaci-backups/pre-a11y-fixes-$(date -u +%Y%m%d-%H%M%S)"
              mkdir -p "$BK"
              php -l $T/db-backup.php
              LIVE=$(wp db tables --all-tables --path="$WP_PATH" | wc -l)
              LUNACI_BACKUP_FILE="$BK/database.sql.gz" wp eval-file $T/db-backup.php --path="$WP_PATH" || { echo "ABORT: database backup failed"; exit 1; }
              gzip -t "$BK/database.sql.gz"
              TABLES=$(zcat "$BK/database.sql.gz" | grep -c "^CREATE TABLE" || true)
              [ "$TABLES" -ge "$LIVE" ] && [ "$TABLES" -gt 10 ] || { echo "ABORT: backup has $TABLES tables, database has $LIVE"; exit 1; }
              tar -czf "$BK/mu-plugins.tar.gz" -C "$WP_PATH/wp-content" mu-plugins
              cp -p "$WP_PATH/.htaccess" "$BK/htaccess.bak"
              echo "$BK" > "$HOME/lunaci-backups/LATEST-a11y-fixes"
              echo "BACKUP OK: $BK ($TABLES tables)"
            else
              BK=$(mktemp -d)
            fi
            DEST="$WP_PATH/wp-content/mu-plugins/lunaci-seo.php"
            [ -f "$DEST" ] && cp -p "$DEST" "$HOME/lunaci-backups/lunaci-seo.php.prev-$(date -u +%Y%m%d-%H%M%S)"
            cp $T/lunaci-seo.php "$DEST"
            echo "deployed: $DEST"
            LUNACI_MODE="$MODE" LUNACI_BACKUP_DIR="$BK" wp eval-file $T/a11y-fixes.php --path="$WP_PATH"
            ICONS="favicon.ico lunaci-icon-192.png lunaci-apple-touch-icon.png"
            if [ "$MODE" = "apply" ]; then
              for f in $ICONS; do
                if [ -e "$WP_PATH/$f" ]; then cp -p "$WP_PATH/$f" "$BK/icon-prev-$f"; else touch "$BK/icon-new-$f"; fi
                cp "$T/$f" "$WP_PATH/$f"; chmod 644 "$WP_PATH/$f"
                cmp -s "$T/$f" "$WP_PATH/$f" && echo "icon deployed: $f" || { echo "FAIL icon $f"; exit 1; }
              done
            elif [ "$MODE" = "rollback" ]; then
              for f in $ICONS; do
                if [ -e "$BK/icon-prev-$f" ]; then cp -p "$BK/icon-prev-$f" "$WP_PATH/$f"; echo "icon restored: $f"
                elif [ -e "$BK/icon-new-$f" ]; then rm -f "$WP_PATH/$f"; echo "icon removed: $f"; fi
              done
            fi
            rm -rf $T
            [ "$MODE" = "dry-run" ] || wp litespeed-purge all --path="$WP_PATH" || true
          REMOTE

      - name: Live check
        if: inputs.mode != 'dry-run'
        run: |
          sleep 3
          python3 - <<'PY'
          import os, re, sys, html, urllib.request
          def get(u):
              req = urllib.request.Request("https://lunacibarcelona.com" + u + "?lc=" + str(os.getpid()), headers={"User-Agent": "Mozilla/5.0 lunaci-check"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.status, r.read().decode("utf-8", "replace")
          def counts(page):
              m = re.search(r"<main.*?</main>", page, re.S) or re.search(r"<body.*", page, re.S)
              t = " " + " ".join(html.unescape(re.sub(r"<[^>]+>", " ", re.sub(r"<(script|style)[^>]*>.*?</\1>", " ", m.group(0), flags=re.S))).split()).lower() + " "
              return sum(t.count(f" {w} ") for w in ("the", "and", "your", "with", "our", "for", "of", "is")), sum(t.count(f" {w} ") for w in ("el", "la", "de", "tu", "con", "para", "los", "las", "que"))
          fail = 0
          def check(ok, msg):
              global fail
              print(("PASS  " if ok else "FAIL  ") + msg); fail |= not ok
          import re as _re
          _, p = get("/about-us/")
          check('aria-label="Cart"' in p, "English cart link has aria-label Cart (/about-us/)")
          check("lunaci-a11y-contrast" in p, "contrast CSS present (/about-us/)")
          check("lunaci-a11y-contrast v4" in p or os.environ.get("MODE") != "update-css", "contrast CSS v4 live (/about-us/)")
          for u in ("/contact/", "/es/contacto/"):
              _, p = get(u)
              check("themes/lunaci/fonts/" not in p and "lunaci-contact-page-css" in p, f"{u}: missing-font rules gone, page CSS still present")
          check('rel="icon"' in p and "/favicon.ico" in p, "favicon link in head (/about-us/)")
          _, p = get("/es/sobre-nosotros/")
          check('aria-label="Carrito"' in p, "Spanish cart link keeps aria-label Carrito")
          check('href="https://lunacibarcelona.com/favicon.ico"' in p, "Spanish page favicon link points to the root, not /es/")
          for u in ("/", "/es/"):
              _, p = get(u)
              m = _re.search(r'<body[^>]*class="([^"]*)"', p)
              check(bool(m) and " home " in " " + m.group(1) + " ", f"{u} body has class home (contrast CSS skips it)")
          _, p = get("/product/lipstick/")
          check(p.count('id="content"') == 1, "product page has exactly one #content skip target")
          _, p = get("/product-category/lips/")
          check(p.count('id="content"') == 1, "category page has exactly one #content skip target")
          req = urllib.request.Request("https://lunacibarcelona.com/favicon.ico", headers={"User-Agent": "Mozilla/5.0 lunaci-check"})
          with urllib.request.urlopen(req, timeout=60) as r:
              body = r.read(); ct = r.headers.get("content-type", "")
          check(r.status == 200 and body[:4] == b"\x00\x00\x01\x00", f"/favicon.ico 200 and an ICO file ({ct}, {len(body)} bytes)")
          for u in ("/", "/es/", "/contact/", "/products/", "/shipping/"):
              code, _ = get(u)
              check(code == 200, f"{u} 200")
          print("RESULT: ALL CHECKS PASSED" if not fail else "RESULT: SOME CHECKS FAILED")
          sys.exit(1 if fail else 0)
          PY
