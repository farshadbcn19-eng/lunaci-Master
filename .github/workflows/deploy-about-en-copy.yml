name: "Deploy - English About copy corrections: official tagline, no forbidden word (dry-run / apply / rollback)"

# Runs assets/luna-import/about-en-copy.php:
#   dry-run  - preconditions and plan only, nothing written
#   apply    - full backup first (database, mu-plugins, .htaccess) to
#              ~/lunaci-backups/pre-about-en-copy-<timestamp>/ (stops on
#              failure); English About quote -> official tagline and
#              "less, when done perfectly" -> "less, done with intention";
#              purges cache; live checks
#   rollback - restores post 59 from the backup JSON

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run, apply or rollback"
        required: true
        default: "dry-run"
        type: choice
        options: ["dry-run", "apply", "rollback"]

# One Hostinger deploy at a time: overlapping runs share /tmp files on the server.
concurrency:
  group: lunaci-hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_PASS: ${{ secrets.HOSTINGER_LUNACI_SSH_PASS }}
      SSH_PORT: ${{ secrets.HOSTINGER_LUNACI_SSH_PORT }}
      SSH_USER: ${{ secrets.HOSTINGER_LUNACI_SSH_USER }}
      SSH_HOST: ${{ secrets.HOSTINGER_LUNACI_SSH_HOST }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Run (with full backup before apply)
        run: |
          set -e
          case "$MODE" in dry-run|apply|rollback) ;; *) echo "bad mode $MODE"; exit 1;; esac
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'rm -rf /tmp/about-en-copy && mkdir -p /tmp/about-en-copy'
          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -o ConnectTimeout=15 -P "$SSH_PORT" \
            "scripts/db-backup.php" "assets/luna-import/about-en-copy.php" \
            "assets/luna-import/header-about-en/about-en-ce307e5-v2.html" \
            "$SSH_USER@$SSH_HOST:/tmp/about-en-copy/"
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "MODE=$MODE"' bash -s' <<'REMOTE'
            set -e
            T=/tmp/about-en-copy
            WP_PATH="";
            for c in "$HOME/public_html" "$HOME" "$(pwd)"; do [ -f "$c/wp-config.php" ] && { WP_PATH="$c"; break; }; done;
            [ -z "$WP_PATH" ] && WP_PATH=$(dirname "$(find -L "$HOME" -maxdepth 8 -name wp-config.php -not -path "*/wp-content/*" 2>/dev/null | head -1)");
            php -l $T/about-en-copy.php
            if [ "$MODE" = "rollback" ]; then
              BK=$(cat "$HOME/lunaci-backups/LATEST-about-en-copy" 2>/dev/null || true)
              [ -n "$BK" ] && [ -f "$BK/about-en-copy-backup.json" ] || { echo "ABORT: no apply backup found"; exit 1; }
            elif [ "$MODE" = "apply" ]; then
              BK="$HOME/lunaci-backups/pre-about-en-copy-$(date -u +%Y%m%d-%H%M%S)"
              mkdir -p "$BK"
              php -l $T/db-backup.php
              LIVE=$(wp db tables --all-tables --path="$WP_PATH" | wc -l)
              LUNACI_BACKUP_FILE="$BK/database.sql.gz" wp eval-file $T/db-backup.php --path="$WP_PATH" || { echo "ABORT: database backup failed"; exit 1; }
              gzip -t "$BK/database.sql.gz"
              TABLES=$(zcat "$BK/database.sql.gz" | grep -c "^CREATE TABLE" || true)
              [ "$TABLES" -ge "$LIVE" ] && [ "$TABLES" -gt 10 ] || { echo "ABORT: backup has $TABLES tables, database has $LIVE"; exit 1; }
              tar -czf "$BK/mu-plugins.tar.gz" -C "$WP_PATH/wp-content" mu-plugins
              cp -p "$WP_PATH/.htaccess" "$BK/htaccess.bak"
              echo "$BK" > "$HOME/lunaci-backups/LATEST-about-en-copy"
              echo "BACKUP OK: $BK ($TABLES tables)"
            else
              BK=$(mktemp -d)
            fi
            LUNACI_MODE="$MODE" LUNACI_BACKUP_DIR="$BK" LUNACI_WIDGET_HTML="$T/about-en-ce307e5-v2.html" wp eval-file $T/about-en-copy.php --path="$WP_PATH"
            rm -rf $T
            [ "$MODE" = "dry-run" ] || wp litespeed-purge all --path="$WP_PATH" || true
          REMOTE

      - name: Live check
        if: inputs.mode != 'dry-run'
        run: |
          sleep 3
          python3 - <<'PY'
          import os, re, sys, html, urllib.request
          mode = os.environ["MODE"]
          req = urllib.request.Request("https://lunacibarcelona.com/about-us/?lc=" + str(os.getpid()), headers={"User-Agent": "Mozilla/5.0 lunaci-check"})
          with urllib.request.urlopen(req, timeout=60) as r:
              code, page = r.status, r.read().decode("utf-8", "replace")
          body = page[page.find('<nav class="lna-nav"'):page.find("</footer>", page.find('<footer class="lna-foot"'))]
          text = " ".join(html.unescape(re.sub(r"<[^>]+>", " ", body)).split())
          fail = 0
          def check(ok, msg):
              global fail
              print(("PASS  " if ok else "FAIL  ") + msg); fail |= not ok
          check(code == 200 and "Our Story" in text and "The Beginning" in text, "/about-us/ 200, English copy present")
          if mode == "apply":
              check("Every woman is seen." in text and "But your presence is remembered." in text, "official tagline in the quote")
              check("All women are seen" not in text and not re.search(r"(?i)perfect", text), "old quote and 'perfect' gone")
              check("less, done with intention, is always more" in text, "Elegance line corrected")
          else:
              check("All women are seen" in text and "when done perfectly" in text, "rollback: previous copy back")
          check('<svg' in body and "(function(){" not in re.sub(r"<script>.*?</script>", "", page, flags=re.S), "widget intact (svg kept, script not printed as text)")
          check(not any(w in text for w in ("Nacido de la luz", "Nuestros Valores", "Todas las mujeres")), "still English only")
          print("RESULT: ALL CHECKS PASSED" if not fail else "RESULT: SOME CHECKS FAILED")
          sys.exit(1 if fail else 0)
          PY
