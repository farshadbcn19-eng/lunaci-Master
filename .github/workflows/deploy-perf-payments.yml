name: "Deploy - product page payment scripts switch (mu-plugin)"

# Sets lunaci_perf_payments_mode for mu-plugins/lunaci-perf.php item 3:
# removes Stripe.js / WooPayments product scripts / PayPal SDK on single
# product pages only (they render no visible element there).
#   test - only on URLs with ?lunaci_perf=1 (visitors see no change)
#   on   - for everyone
#   off  - inactive
# Leaves lunaci_perf_mode (WebP + fonts) unchanged.
# 1. Full backup to ~/lunaci-backups/pre-perf-payments-<timestamp>/; stops on failure.
# 2. Deploys the mu-plugin, sets the option, purges cache.
# 3. Live check. Rollback: run with mode "off".

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test, on or off"
        required: true
        default: "test"
        type: choice
        options: ["test", "on", "off"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SSH_PASS: ${{ secrets.HOSTINGER_LUNACI_SSH_PASS }}
      SSH_PORT: ${{ secrets.HOSTINGER_LUNACI_SSH_PORT }}
      SSH_USER: ${{ secrets.HOSTINGER_LUNACI_SSH_USER }}
      SSH_HOST: ${{ secrets.HOSTINGER_LUNACI_SSH_HOST }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Full pre-deploy backup (database, mu-plugins, .htaccess)
        run: |
          set -e
          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -o ConnectTimeout=15 -P "$SSH_PORT" \
            "scripts/db-backup.php" "$SSH_USER@$SSH_HOST:/tmp/lunaimport-db-backup.php"
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" '
            set -e
            WP_PATH="";
            for c in "$HOME/public_html" "$HOME" "$(pwd)"; do [ -f "$c/wp-config.php" ] && { WP_PATH="$c"; break; }; done;
            [ -z "$WP_PATH" ] && WP_PATH=$(dirname "$(find -L "$HOME" -maxdepth 8 -name wp-config.php -not -path "*/wp-content/*" 2>/dev/null | head -1)");
            BK="$HOME/lunaci-backups/pre-perf-payments-$(date -u +%Y%m%d-%H%M%S)";
            mkdir -p "$BK";
            php -l /tmp/lunaimport-db-backup.php;
            LIVE=$(wp db tables --all-tables --path="$WP_PATH" | wc -l);
            echo "--- tables in database: $LIVE";
            LUNACI_BACKUP_FILE="$BK/database.sql.gz" wp eval-file /tmp/lunaimport-db-backup.php --path="$WP_PATH" || { echo "ABORT: database backup failed"; exit 1; };
            rm -f /tmp/lunaimport-db-backup.php;
            gzip -t "$BK/database.sql.gz";
            TABLES=$(zcat "$BK/database.sql.gz" | grep -c "^CREATE TABLE" || true);
            [ "$TABLES" -ge "$LIVE" ] && [ "$TABLES" -gt 10 ] || { echo "ABORT: backup has $TABLES tables, database has $LIVE"; exit 1; };
            tar -czf "$BK/mu-plugins.tar.gz" -C "$WP_PATH/wp-content" mu-plugins;
            cp -p "$WP_PATH/.htaccess" "$BK/htaccess.bak";
            wp plugin list --fields=name,status,version --format=csv --path="$WP_PATH" > "$BK/plugins.csv" 2>/dev/null;
            echo "lunaci_perf_mode: $(wp option get lunaci_perf_mode --path="$WP_PATH" 2>/dev/null || echo "(not set)")" | tee "$BK/perf-modes-before.txt";
            echo "lunaci_perf_payments_mode: $(wp option get lunaci_perf_payments_mode --path="$WP_PATH" 2>/dev/null || echo "(not set)")" | tee -a "$BK/perf-modes-before.txt";
            echo "BACKUP OK: $BK ($TABLES tables)"
          '

      - name: Deploy mu-plugin and set payments mode
        run: |
          set -e
          case "$MODE" in test|on|off) ;; *) echo "bad mode $MODE"; exit 1;; esac
          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -o ConnectTimeout=15 -P "$SSH_PORT" \
            "mu-plugins/lunaci-perf.php" "$SSH_USER@$SSH_HOST:/tmp/lunaimport-perf.php"
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "MODE=$MODE"' bash -s' <<'REMOTE'
            set -e
            WP_PATH="";
            for c in "$HOME/public_html" "$HOME" "$(pwd)"; do [ -f "$c/wp-config.php" ] && { WP_PATH="$c"; break; }; done;
            [ -z "$WP_PATH" ] && WP_PATH=$(dirname "$(find -L "$HOME" -maxdepth 8 -name wp-config.php -not -path "*/wp-content/*" 2>/dev/null | head -1)");
            php -l /tmp/lunaimport-perf.php
            DEST="$WP_PATH/wp-content/mu-plugins/lunaci-perf.php"
            [ -f "$DEST" ] && cp -p "$DEST" "$HOME/lunaci-backups/lunaci-perf.php.prev-$(date -u +%Y%m%d-%H%M%S)"
            cp /tmp/lunaimport-perf.php "$DEST" && rm -f /tmp/lunaimport-perf.php
            echo "deployed: $DEST"
            [ "$(wp option get lunaci_perf_payments_mode --path="$WP_PATH" 2>/dev/null)" = "$MODE" ] && echo "lunaci_perf_payments_mode already $MODE" || wp option update lunaci_perf_payments_mode "$MODE" --autoload=yes --path="$WP_PATH"
            echo "lunaci_perf_mode: $(wp option get lunaci_perf_mode --path="$WP_PATH")  lunaci_perf_payments_mode: $(wp option get lunaci_perf_payments_mode --path="$WP_PATH")"
            wp litespeed-purge all --path="$WP_PATH" || true
          REMOTE

      - name: Live check
        run: |
          BASE="https://lunacibarcelona.com"
          FAIL=0
          pass() { echo "PASS  $1"; }
          fail() { echo "FAIL  $1"; FAIL=1; }
          sleep 3
          case "$MODE" in test) Q="?lunaci_perf=1";; *) Q="";; esac
          PAY='js\.stripe\.com|ppcp-sdk-v6-js-boot|woocommerce-payments/dist/product-details|woocommerce-payments/dist/frontend-tracks'
          for p in /product/lipstick/ /product/foundation/ /es/producto/pintalabios/; do
            curl -sS -m 60 -o page.html -w "%{http_code}" "$BASE$p$Q" > code.txt
            [ "$(cat code.txt)" = "200" ] || fail "$p$Q status $(cat code.txt)"
            N=$(grep -cE "<script[^>]+($PAY)" page.html || true)
            W=$(grep -oE '\.(png|jpe?g)\.webp' page.html | wc -l)
            grep -q 'name="add-to-cart"\|single_add_to_cart_button' page.html && pass "$p$Q add-to-cart form present" || fail "$p$Q add-to-cart form missing"
            if [ "$MODE" = "off" ]; then
              [ "$N" -gt 0 ] && pass "$p payment scripts present (off): $N" || fail "$p payment scripts missing while off"
            else
              [ "$N" = "0" ] && pass "$p$Q payment scripts removed" || fail "$p$Q still has $N payment scripts"
            fi
            [ "$W" -gt 0 ] && pass "$p$Q WebP still active ($W)" || echo "INFO  $p$Q no WebP URLs (lunaci_perf_mode may be off)"
          done
          if [ "$MODE" = "test" ]; then
            curl -sS -m 60 "$BASE/product/lipstick/" -o plain.html
            N=$(grep -cE "<script[^>]+($PAY)" plain.html || true)
            [ "$N" -gt 0 ] && pass "visitors (no ?lunaci_perf) unchanged: $N payment scripts" || fail "visitors already lost payment scripts in test mode"
          fi
          # Guest cart and checkout still work.
          J=$(mktemp)
          NONCE=$(curl -sS -m 30 -c "$J" -b "$J" -D - -o /dev/null "$BASE/wp-json/wc/store/v1/cart" | grep -i '^nonce:' | awk '{print $2}' | tr -d '\r')
          curl -sS -m 30 -c "$J" -b "$J" -H "Nonce: $NONCE" -H 'Content-Type: application/json' \
            -d '{"id":501,"quantity":1}' "$BASE/wp-json/wc/store/v1/cart/add-item" -o cart.json
          ITEMS=$(python3 -c "import json;print(json.load(open('cart.json')).get('items_count','?'))" 2>/dev/null || echo "?")
          [ "$ITEMS" = "1" ] && pass "guest add-to-cart: items_count=1" || fail "guest add-to-cart: items_count=$ITEMS"
          curl -sS -m 60 -c "$J" -b "$J" "$BASE/checkout/" -o checkout.html -w "%{http_code}" > code.txt
          GW=$(grep -oE 'woocommerce_payments|ppcp-gateway|wc-stripe|payment_method_[a-z_]+' checkout.html | sort -u | tr '\n' ' ')
          [ "$(cat code.txt)" = "200" ] && [ -n "$GW" ] && pass "checkout loads with gateways: $GW" || fail "checkout status $(cat code.txt), gateways: '$GW'"
          if [ "$FAIL" = "0" ]; then echo "RESULT: ALL CHECKS PASSED"; else echo "RESULT: SOME CHECKS FAILED"; exit 1; fi
