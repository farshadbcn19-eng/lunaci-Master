name: "Deploy - Spanish shade selection: link variations, variable parents (dry-run / apply / rollback)"

# Runs assets/luna-import/wcml-es-variations.php:
#   dry-run  - match the 57 Spanish variations to the English ones, nothing written
#   apply    - full backup first; links each Spanish variation to its English
#              variation in WPML, sets the six simple Spanish parents to
#              variable, resyncs their price meta, renames the shade
#              "Perfect 04-V" -> "Signature 04-V" (and pa_color "Perfect 04");
#              purges cache; live checks incl. a Store API add-to-cart
#   rollback - restores everything from the backup JSON

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run, apply or rollback"
        required: true
        default: "dry-run"
        type: choice
        options: ["dry-run", "apply", "rollback"]

# One Hostinger deploy at a time: overlapping runs share /tmp files on the server.
concurrency:
  group: lunaci-hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_PASS: ${{ secrets.HOSTINGER_LUNACI_SSH_PASS }}
      SSH_PORT: ${{ secrets.HOSTINGER_LUNACI_SSH_PORT }}
      SSH_USER: ${{ secrets.HOSTINGER_LUNACI_SSH_USER }}
      SSH_HOST: ${{ secrets.HOSTINGER_LUNACI_SSH_HOST }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Run (with full backup before apply)
        run: |
          set -e
          case "$MODE" in dry-run|apply|rollback) ;; *) echo "bad mode $MODE"; exit 1;; esac
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'rm -rf /tmp/wcml-es-variations && mkdir -p /tmp/wcml-es-variations'
          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -o ConnectTimeout=15 -P "$SSH_PORT" \
            "scripts/db-backup.php" "assets/luna-import/wcml-es-variations.php" \
            "$SSH_USER@$SSH_HOST:/tmp/wcml-es-variations/"
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "MODE=$MODE"' bash -s' <<'REMOTE'
            set -e
            T=/tmp/wcml-es-variations
            WP_PATH="";
            for c in "$HOME/public_html" "$HOME" "$(pwd)"; do [ -f "$c/wp-config.php" ] && { WP_PATH="$c"; break; }; done;
            [ -z "$WP_PATH" ] && WP_PATH=$(dirname "$(find -L "$HOME" -maxdepth 8 -name wp-config.php -not -path "*/wp-content/*" 2>/dev/null | head -1)");
            php -l $T/wcml-es-variations.php
            if [ "$MODE" = "rollback" ]; then
              BK=$(cat "$HOME/lunaci-backups/LATEST-wcml-es-variations" 2>/dev/null || true)
              [ -n "$BK" ] && [ -f "$BK/wcml-es-variations-backup.json" ] || { echo "ABORT: no apply backup found"; exit 1; }
            elif [ "$MODE" = "apply" ]; then
              BK="$HOME/lunaci-backups/pre-wcml-es-variations-$(date -u +%Y%m%d-%H%M%S)"
              mkdir -p "$BK"
              php -l $T/db-backup.php
              LIVE=$(wp db tables --all-tables --path="$WP_PATH" | wc -l)
              LUNACI_BACKUP_FILE="$BK/database.sql.gz" wp eval-file $T/db-backup.php --path="$WP_PATH" || { echo "ABORT: database backup failed"; exit 1; }
              gzip -t "$BK/database.sql.gz"
              TABLES=$(zcat "$BK/database.sql.gz" | grep -c "^CREATE TABLE" || true)
              [ "$TABLES" -ge "$LIVE" ] && [ "$TABLES" -gt 10 ] || { echo "ABORT: backup has $TABLES tables, database has $LIVE"; exit 1; }
              tar -czf "$BK/mu-plugins.tar.gz" -C "$WP_PATH/wp-content" mu-plugins
              cp -p "$WP_PATH/.htaccess" "$BK/htaccess.bak"
              echo "$BK" > "$HOME/lunaci-backups/LATEST-wcml-es-variations"
              echo "BACKUP OK: $BK ($TABLES tables)"
            else
              BK=$(mktemp -d)
            fi
            LUNACI_MODE="$MODE" LUNACI_BACKUP_DIR="$BK" wp eval-file $T/wcml-es-variations.php --path="$WP_PATH"
            rm -rf $T
            [ "$MODE" = "dry-run" ] || wp litespeed-purge all --path="$WP_PATH" || true
          REMOTE

      - name: Live check
        if: inputs.mode != 'dry-run'
        run: |
          sleep 3
          python3 - <<'PY'
          import os, re, sys, json, html, urllib.request, http.cookiejar
          mode = os.environ["MODE"]
          base = "https://lunacibarcelona.com"
          pairs = [("lipstick", "pintalabios"), ("lip-fix", "fijador-de-labios-lunaci"), ("lipgloss-velvet", "brillo-de-labios-velvet-lunaci"), ("lip-pencil", "delineador-de-labios-lunaci"), ("foundation", "base-de-maquillaje"), ("compact-powder", "polvo-compacto-lunaci"), ("blusher", "colorete"), ("eyebrow-pencil", "lapiz-de-cejas-lunaci"), ("nail-polish-long-lasting", "esmalte-de-unas-larga-duracion-lunaci")]
          def get(u):
              req = urllib.request.Request(base + u + "?lc=" + str(os.getpid()), headers={"User-Agent": "Mozilla/5.0 lunaci-check"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read().decode("utf-8", "replace")
          def variations(page):
              m = re.search(r'data-product_variations="([^"]*)"', page)
              if not m or m.group(1) == "false":
                  return None
              return json.loads(html.unescape(m.group(1)))
          fail = 0
          def check(ok, msg):
              global fail
              print(("PASS  " if ok else "FAIL  ") + msg); fail |= not ok
          es_var_id = None
          for en, es in pairs:
              ve, vs = variations(get(f"/product/{en}/")), variations(get(f"/es/producto/{es}/"))
              se = sorted(v["attributes"].get("attribute_shade", "") for v in (ve or []))
              ss = sorted(v["attributes"].get("attribute_shade", "") for v in (vs or []))
              pe = sorted(v["display_price"] for v in (ve or []))
              ps = sorted(v["display_price"] for v in (vs or []))
              if mode == "apply":
                  check(ve and vs and se == ss and pe == ps, f"/es/producto/{es}/ shade selector: {len(ss)} shades, same shades and prices as EN ({len(se)})")
                  if vs and es == "fijador-de-labios-lunaci":
                      es_var_id = vs[0]["variation_id"]
              else:
                  check(ve is not None, f"/product/{en}/ still variable ({len(se)} shades)")
              blob = json.dumps((ve or []) + (vs or []))
              if en == "lipgloss-velvet":
                  want, gone = ("Signature 04-V", "Perfect 04-V") if mode == "apply" else ("Perfect 04-V", "Signature 04-V")
                  check(want in blob and gone not in blob, f"lipgloss shade '{want}' (EN and ES), '{gone}' gone")
          if mode == "apply" and es_var_id:
              cj = http.cookiejar.CookieJar()
              op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
              r = op.open(urllib.request.Request(base + "/wp-json/wc/store/v1/cart", headers={"User-Agent": "Mozilla/5.0 lunaci-check"}), timeout=60)
              nonce = r.headers.get("Nonce")
              body = json.dumps({"id": es_var_id, "quantity": 1}).encode()
              req = urllib.request.Request(base + "/wp-json/wc/store/v1/cart/add-item?lang=es", data=body, headers={"User-Agent": "Mozilla/5.0 lunaci-check", "Content-Type": "application/json", "Nonce": nonce or ""}, method="POST")
              try:
                  r = op.open(req, timeout=60)
                  cart = json.loads(r.read().decode())
                  items = cart.get("items", [])
                  check(r.status in (200, 201) and any(i.get("id") == es_var_id for i in items), f"Store API: Spanish Fijador variation {es_var_id} added to cart ({[i.get('name') + ' / ' + ', '.join(a.get('value', '') for a in i.get('variation', [])) for i in items]})")
              except urllib.error.HTTPError as e:
                  check(False, f"Store API add-to-cart HTTP {e.code}: {e.read().decode()[:200]}")
          print("RESULT: ALL CHECKS PASSED" if not fail else "RESULT: SOME CHECKS FAILED")
          sys.exit(1 if fail else 0)
          PY
