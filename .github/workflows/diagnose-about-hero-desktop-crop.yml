name: Diagnose - About Us hero desktop crop + text position (read-only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y > /dev/null
          npm install playwright@1.48.0 > /dev/null
          npx playwright install --with-deps chromium

      - name: Run diagnostic
        run: |
          mkdir -p /tmp/out
          node assets/luna-import/diagnose-about-hero-desktop-crop.js

      - name: Commit results to diagnostics branch
        run: |
          set -e
          git config user.name "diagnostic-bot"
          git config user.email "diagnostic-bot@users.noreply.github.com"

          git checkout --orphan diagnostics/about-hero-desktop-crop
          git rm -rf . > /dev/null 2>&1 || true

          cp /tmp/out/about-hero-desktop-info.json ./about-hero-desktop-info.json
          cp /tmp/out/about-hero-desktop_1440.png ./about-hero-desktop_1440.png
          cp /tmp/out/about-hero-desktop_1920.png ./about-hero-desktop_1920.png

          git add about-hero-desktop-info.json about-hero-desktop_1440.png about-hero-desktop_1920.png
          git commit -m "Diagnostic: About Us hero desktop crop + text position"
          git push --force origin diagnostics/about-hero-desktop-crop

          echo "OK: pushed diagnostics/about-hero-desktop-crop branch"
