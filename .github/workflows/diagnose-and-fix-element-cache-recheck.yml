name: Fix - re-check and re-delete Elementor element cache + purge (visible output)

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Transfer script and run it (guarded)
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          set -e

          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            -P "$SSH_PORT" "assets/luna-import/diagnose-and-fix-element-cache-recheck.php" \
            "$SSH_USER@$SSH_HOST:/tmp/lunaimport-diagnose-and-fix-element-cache-recheck.php"

          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then WP_PATH="$candidate"; break; fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then WP_PATH=$(dirname "$FOUND"); fi;
             fi;
             if [ -z "$WP_PATH" ]; then echo "ERROR: could not locate wp-config.php"; exit 1; fi;
             echo "WordPress found at: $WP_PATH";

             php -l /tmp/lunaimport-diagnose-and-fix-element-cache-recheck.php;
             LINT_STATUS=$?;
             if [ "$LINT_STATUS" -ne 0 ]; then
               echo "ABORT: php -l failed";
               rm -f /tmp/lunaimport-diagnose-and-fix-element-cache-recheck.php;
               exit 1;
             fi;

             wp eval-file /tmp/lunaimport-diagnose-and-fix-element-cache-recheck.php --path="$WP_PATH";
             EVAL_STATUS=$?;
             rm -f /tmp/lunaimport-diagnose-and-fix-element-cache-recheck.php;
             if [ "$EVAL_STATUS" -ne 0 ]; then
               echo "ABORT: wp eval-file failed (exit code $EVAL_STATUS)";
               exit 1;
             fi;

             echo "";
             echo "--- purging LiteSpeed cache (visible output, no stderr suppression) ---";
             wp litespeed-purge all --path="$WP_PATH";

             echo "";
             echo "--- immediate re-fetch from origin to see fresh regeneration ---";
             sleep 2;
             curl -sk -H "Host: lunacibarcelona.com" "https://127.0.0.1/about-us/" -o /tmp/immediate.html -D /tmp/immediate-headers.txt --max-time 20;
             grep -i "^x-litespeed-cache:" /tmp/immediate-headers.txt || echo "no cache header";
             echo -n "contains new marker: "; grep -c "align-items:center;}}" /tmp/immediate.html || echo 0;
             rm -f /tmp/immediate.html /tmp/immediate-headers.txt;

             echo "OK: done"'
