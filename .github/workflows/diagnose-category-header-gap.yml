name: Diagnose - gap between category banner and title/breadcrumb (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Transfer diagnostic script, run it, then dump live markup between banner and breadcrumb
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          set -e

          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            -P "$SSH_PORT" "assets/luna-import/diagnose-category-header-gap.php" \
            "$SSH_USER@$SSH_HOST:/tmp/lunaimport-diagnose-category-header-gap.php"

          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then WP_PATH="$candidate"; break; fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then WP_PATH=$(dirname "$FOUND"); fi;
             fi;
             if [ -z "$WP_PATH" ]; then echo "ERROR: could not locate wp-config.php"; exit 1; fi;
             echo "WordPress found at: $WP_PATH";

             php -l /tmp/lunaimport-diagnose-category-header-gap.php;
             LINT_STATUS=$?;
             if [ "$LINT_STATUS" -ne 0 ]; then
               echo "ABORT: php -l failed";
               rm -f /tmp/lunaimport-diagnose-category-header-gap.php;
               exit 1;
             fi;

             wp eval-file /tmp/lunaimport-diagnose-category-header-gap.php --path="$WP_PATH";
             EVAL_STATUS=$?;
             rm -f /tmp/lunaimport-diagnose-category-header-gap.php;
             if [ "$EVAL_STATUS" -ne 0 ]; then
               echo "ABORT: wp eval-file failed (exit code $EVAL_STATUS)";
               exit 1;
             fi;

             echo "";
             echo "--- live /product-category/face/ page: markup between banner and breadcrumb ---";
             curl -s "https://lunacibarcelona.com/product-category/face/" -o /tmp/lunaimport-face-gap.html --max-time 20;
             echo "--- lines from banner div through the h1 page-title (grep -n, -A 40) ---";
             grep -n "lunaci-category-banner\">" /tmp/lunaimport-face-gap.html;
             LINE=$(grep -n "lunaci-category-banner\">" /tmp/lunaimport-face-gap.html | head -1 | cut -d: -f1);
             if [ -n "$LINE" ]; then
               sed -n "${LINE},$((LINE+3))p" /tmp/lunaimport-face-gap.html;
             fi;
             echo "--- woocommerce-products-header opening tag and any inline style ---";
             grep -oE "<header[^>]*woocommerce-products-header[^>]*>" /tmp/lunaimport-face-gap.html || echo "(not found)";
             echo "--- page-title / breadcrumb related class context (raw grep -o, first 5 matches) ---";
             grep -oE "<[a-z0-9]+[^>]*class=\"[^\"]*(page-title|woocommerce-breadcrumb|products-header)[^\"]*\"[^>]*>" /tmp/lunaimport-face-gap.html | head -5;
             rm -f /tmp/lunaimport-face-gap.html;
             echo "OK: diagnostic completed successfully"'
