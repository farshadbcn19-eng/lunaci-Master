name: Diagnose Duplicate Terms of Service Link (Read-Only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -y && sudo apt-get install -y sshpass

      - name: Inspect post_content, _elementor_data, _elementor_element_cache, and active plugins
        run: |
          set -o pipefail
          sshpass -p "${{ secrets.HOSTINGER_SSH_PASS }}" ssh -o StrictHostKeyChecking=no \
            -p ${{ secrets.HOSTINGER_SSH_PORT }} \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then
                 WP_PATH="$candidate";
                 break;
               fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" \
                 -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then
                 WP_PATH=$(dirname "$FOUND");
               fi;
             fi;
             if [ -z "$WP_PATH" ]; then
               echo "ERROR: could not locate wp-config.php under $HOME";
               exit 1;
             fi;
             echo "WordPress found at: $WP_PATH";
             echo "" | base64 -d > /tmp/diagnose-double-terms-link.php;
             php -l /tmp/diagnose-double-terms-link.php;
             LINT_STATUS=$?;
             if [ "$LINT_STATUS" -ne 0 ]; then
               echo "ABORT: php -l failed on diagnostic script";
               rm -f /tmp/diagnose-double-terms-link.php;
               exit 1;
             fi;
             wp eval-file /tmp/diagnose-double-terms-link.php --path="$WP_PATH";
             EVAL_STATUS=$?;
             rm -f /tmp/diagnose-double-terms-link.php;
             if [ "$EVAL_STATUS" -ne 0 ]; then
               echo "ABORT: wp eval-file failed (exit code $EVAL_STATUS)";
               exit 1;
             fi' | tee wp-diagnose-output.txt

      - name: Fetch live rendered HTML and count actual occurrences
        run: |
          set -o pipefail
          echo "## Live HTML ground truth" >> "$GITHUB_STEP_SUMMARY"
          for path in "" "about-us/" "product/"; do
            url="https://lunacibarcelona.com/$path"
            html=$(curl -sgL "$url")
            code=$(curl -sgL -o /dev/null -w "%{http_code}" "$url")
            terms_count=$(echo "$html" | grep -o "terms-of-service" | wc -l)
            privacy_count=$(echo "$html" | grep -o "privacy-policy" | wc -l)
            echo "URL: $url  HTTP=$code  'terms-of-service' occurrences=$terms_count  'privacy-policy' occurrences=$privacy_count" | tee -a live-html-output.txt
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat live-html-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Write job summary (WP-side diagnostic)
        if: always()
        run: |
          echo "## Elementor/post_content duplicate-link diagnostic (read-only)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat wp-diagnose-output.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no output captured)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
