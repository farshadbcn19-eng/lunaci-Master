name: Diagnose Elementor Footer Privacy Link (Read-Only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -y && sudo apt-get install -y sshpass

      - name: Scan wp_postmeta._elementor_data for privacy-policy references
        run: |
          sshpass -p "${{ secrets.HOSTINGER_SSH_PASS }}" ssh -o StrictHostKeyChecking=no \
            -p ${{ secrets.HOSTINGER_SSH_PORT }} \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then
                 WP_PATH="$candidate";
                 break;
               fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" \
                 -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then
                 WP_PATH=$(dirname "$FOUND");
               fi;
             fi;
             if [ -z "$WP_PATH" ]; then
               echo "ERROR: could not locate wp-config.php under $HOME";
               exit 1;
             fi;
             echo "WordPress found at: $WP_PATH";
             echo "" | base64 -d > /tmp/diagnose-elementor-footer.php;
             php -l /tmp/diagnose-elementor-footer.php;
             LINT_STATUS=$?;
             if [ "$LINT_STATUS" -ne 0 ]; then
               echo "ABORT: php -l failed on diagnostic script";
               rm -f /tmp/diagnose-elementor-footer.php;
               exit 1;
             fi;
             wp eval-file /tmp/diagnose-elementor-footer.php --path="$WP_PATH";
             EVAL_STATUS=$?;
             rm -f /tmp/diagnose-elementor-footer.php;
             if [ "$EVAL_STATUS" -ne 0 ]; then
               echo "ABORT: wp eval-file failed (exit code $EVAL_STATUS)";
               exit 1;
             fi' | tee diagnose-output.txt

      - name: Write job summary
        if: always()
        run: |
          echo "## Elementor footer privacy-policy diagnostic (read-only)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat diagnose-output.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no output captured)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
