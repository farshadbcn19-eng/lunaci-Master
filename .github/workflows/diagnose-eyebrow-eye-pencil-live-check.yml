name: Diagnose - Eyebrow/Eye Pencil real photo live check via SSH (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: SSH in and curl the shop page from the server itself
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          set -e
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'curl -s "https://lunacibarcelona.com/shop/" -o /tmp/lunaimport-check.html --max-time 20;
             echo "response length: $(wc -c < /tmp/lunaimport-check.html)";
             echo -n "contains new eyebrow real photo url: "; grep -c "lunaimport-eyebrow-pencil-real" /tmp/lunaimport-check.html || echo 0;
             echo -n "contains new eye real photo url: "; grep -c "lunaimport-eye-pencil-real" /tmp/lunaimport-check.html || echo 0;
             echo -n "contains OLD eyebrow-pencil filename (no -real suffix): "; grep -c "lunaci-eyebrow-pencil-600x800" /tmp/lunaimport-check.html || echo 0;
             echo -n "contains OLD eye-pencil filename (no -real suffix): "; grep -c "lunaci-eye-pencil-e1781429622606-600x800" /tmp/lunaimport-check.html || echo 0;
             rm -f /tmp/lunaimport-check.html'
