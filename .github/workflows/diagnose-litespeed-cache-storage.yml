name: Diagnose - locate + directly clear LiteSpeed cache storage (guarded, cache-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Locate and clear LiteSpeed cache storage
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          set -e

          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then WP_PATH="$candidate"; break; fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then WP_PATH=$(dirname "$FOUND"); fi;
             fi;
             if [ -z "$WP_PATH" ]; then echo "ERROR: could not locate wp-config.php"; exit 1; fi;
             echo "WordPress found at: $WP_PATH";

             echo "--- searching for lscache-related directories under wp-content ---";
             find "$WP_PATH/wp-content" -maxdepth 3 -iname "*cache*" -type d 2>/dev/null;

             echo "";
             echo "--- checking /dev/shm/lscache (common LSCache tmpfs location) ---";
             ls -la /dev/shm/ 2>/dev/null | grep -i lscache || echo "not found under /dev/shm";
             ls -la /dev/shm/lscache/ 2>/dev/null | head -20 || echo "no /dev/shm/lscache dir";

             echo "";
             echo "--- checking home dir for lscache/litespeed cache dirs ---";
             find "$HOME" -maxdepth 4 -iname "*lscache*" 2>/dev/null;
             find "$HOME" -maxdepth 4 -iname "*litespeed*" -type d 2>/dev/null;

             echo "";
             echo "--- wp-content/cache contents (if exists) ---";
             ls -la "$WP_PATH/wp-content/cache/" 2>/dev/null || echo "no wp-content/cache dir";

             echo "";
             echo "--- checking for .htaccess LiteSpeed cache rules ---";
             grep -i "lscache\|litespeed" "$WP_PATH/.htaccess" 2>/dev/null | head -20 || echo "no litespeed rules in .htaccess"'
