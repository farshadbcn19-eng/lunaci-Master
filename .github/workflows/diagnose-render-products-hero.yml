name: Diagnose - render live Products hero banner with a real browser (read-only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y > /dev/null
          npm install playwright@1.48.0 > /dev/null
          npx playwright install --with-deps chromium

      - name: Run render diagnostic
        run: |
          mkdir -p /tmp/out
          node assets/luna-import/screenshot-products-hero.js

      - name: Commit screenshots + info to diagnostics branch
        run: |
          set -e
          git config user.name "diagnostic-bot"
          git config user.email "diagnostic-bot@users.noreply.github.com"

          git checkout --orphan diagnostics/products-hero-render
          git rm -rf . > /dev/null 2>&1 || true

          cp /tmp/out/hero-viewport.png ./hero-viewport.png
          cp /tmp/out/hero-fullpage.png ./hero-fullpage.png
          cp /tmp/out/hero-info.json ./hero-info.json

          git add hero-viewport.png hero-fullpage.png hero-info.json
          git commit -m "Diagnostic render of live Products hero banner"
          git push --force origin diagnostics/products-hero-render

          echo "OK: pushed diagnostics/products-hero-render branch"
