name: "Diagnose - Code Snippets plugin table (read-only)"

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install sshpass
        run: sudo apt-get install -y sshpass
      - name: Query snippets table
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          set -e
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then WP_PATH="$candidate"; break; fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then WP_PATH=$(dirname "$FOUND"); fi;
             fi;
             echo "WP_PATH=$WP_PATH";

             cat > /tmp/lunaimport-diag-snippets-table.php << "PHPEOF"
<?php
global $wpdb;
$table = $wpdb->prefix . "snippets";
$exists = $wpdb->get_var( $wpdb->prepare( "SHOW TABLES LIKE %s", $table ) );
echo "table {$table} exists: " . var_export( (bool) $exists, true ) . "\n";
if ( $exists ) {
    $rows = $wpdb->get_results( "SELECT id, name, active, scope, LENGTH(code) as code_len FROM {$table}", ARRAY_A );
    foreach ( (array) $rows as $r ) {
        echo "id={$r[\"id\"]} name={$r[\"name\"]} active={$r[\"active\"]} scope={$r[\"scope\"]} code_len={$r[\"code_len\"]}\n";
    }
    echo "\n--- snippets whose code mentions lunaci-filter-btn or /shop/ ---\n";
    $matches = $wpdb->get_results( $wpdb->prepare( "SELECT id, name, code FROM {$table} WHERE code LIKE %s OR code LIKE %s", "%lunaci-filter-btn%", "%/shop/%" ), ARRAY_A );
    foreach ( (array) $matches as $m ) {
        echo "MATCH id={$m[\"id\"]} name={$m[\"name\"]}\n";
        echo substr( $m["code"], 0, 3000 ) . "\n---\n";
    }
    if ( ! $matches ) {
        echo "(no matches)\n";
    }
}
echo "OK: done\n";
PHPEOF
             php -l /tmp/lunaimport-diag-snippets-table.php;
             wp eval-file /tmp/lunaimport-diag-snippets-table.php --path="$WP_PATH";
             rm -f /tmp/lunaimport-diag-snippets-table.php;
             echo "OK: workflow completed"'
