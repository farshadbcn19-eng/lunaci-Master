name: "Diagnose - validate grep sanity + broaden search (read-only)"

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install sshpass
        run: sudo apt-get install -y sshpass
      - name: Validate and broaden grep
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          set -e
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then WP_PATH="$candidate"; break; fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then WP_PATH=$(dirname "$FOUND"); fi;
             fi;
             echo "WP_PATH=$WP_PATH";
             echo "--- ls WP_PATH ---";
             ls -la "$WP_PATH" | head -20;
             echo "--- find ALL wp-config.php under HOME ---";
             find -L "$HOME" -maxdepth 6 -iname "wp-config.php" 2>/dev/null;
             echo "--- sanity: does a KNOWN string exist under WP_PATH? ---";
             grep -rl "Signature Pieces" "$WP_PATH" --exclude-dir=cache --exclude-dir=litespeed 2>&1 | head -20;
             echo "--- sanity: known image filename ---";
             grep -rl "lunaci-foundation.jpg" "$WP_PATH" --exclude-dir=cache --exclude-dir=litespeed 2>&1 | head -20;
             echo "--- now unrestricted, case-insensitive, for filter-btn fragment ---";
             grep -rli "filter-btn" "$WP_PATH" 2>&1 | head -30;
             echo "--- and for lunaci-filter (partial) ---";
             grep -rli "lunaci-filter" "$WP_PATH" 2>&1 | head -30;
             echo "OK: validate diagnostic completed"'
