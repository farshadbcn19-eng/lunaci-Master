name: Diagnose - shop page product images blur/quality (read-only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y > /dev/null
          npm install playwright@1.48.0 > /dev/null
          npx playwright install --with-deps chromium

      - name: Run diagnostic
        run: |
          mkdir -p /tmp/out
          node assets/luna-import/diagnose-shop-images-blur.js

      - name: Commit results to diagnostics branch
        run: |
          set -e
          git config user.name "diagnostic-bot"
          git config user.email "diagnostic-bot@users.noreply.github.com"

          git checkout --orphan diagnostics/shop-images-blur
          git rm -rf . > /dev/null 2>&1 || true

          cp /tmp/out/shop-images-blur.json ./shop-images-blur.json
          cp /tmp/out/shop-full-desktop.png ./shop-full-desktop.png

          git add shop-images-blur.json shop-full-desktop.png
          git commit -m "Diagnostic: shop page product image blur/quality measurement"
          git push --force origin diagnostics/shop-images-blur

          echo "OK: pushed diagnostics/shop-images-blur branch"
