name: Diagnose - why WPCode post 319 edit isn't rendering live (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Transfer diagnostic script and run it (read-only)
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          set -e

          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            -P "$SSH_PORT" "assets/luna-import/diagnose-wpcode-319-not-rendering.php" \
            "$SSH_USER@$SSH_HOST:/tmp/lunaimport-diagnose-wpcode-319-not-rendering.php"

          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then WP_PATH="$candidate"; break; fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then WP_PATH=$(dirname "$FOUND"); fi;
             fi;
             if [ -z "$WP_PATH" ]; then echo "ERROR: could not locate wp-config.php"; exit 1; fi;
             echo "WordPress found at: $WP_PATH";

             php -l /tmp/lunaimport-diagnose-wpcode-319-not-rendering.php;
             LINT_STATUS=$?;
             if [ "$LINT_STATUS" -ne 0 ]; then
               echo "ABORT: php -l failed";
               rm -f /tmp/lunaimport-diagnose-wpcode-319-not-rendering.php;
               exit 1;
             fi;

             wp eval-file /tmp/lunaimport-diagnose-wpcode-319-not-rendering.php --path="$WP_PATH";
             EVAL_STATUS=$?;
             rm -f /tmp/lunaimport-diagnose-wpcode-319-not-rendering.php;
             if [ "$EVAL_STATUS" -ne 0 ]; then
               echo "ABORT: wp eval-file failed (exit code $EVAL_STATUS)";
               exit 1;
             fi;

             echo "";
             echo "=== 6. search for any WPCode-generated static CSS/cache files on disk ===";
             find "$WP_PATH/wp-content" -maxdepth 4 -iname "*wpcode*" 2>/dev/null | sort;

             echo "";
             echo "=== 7. search entire wp-content for any file containing the old CSS fragment (limited depth, excluding huge dirs) ===";
             grep -rl --include="*.css" --include="*.php" "lna-hero__ov2" "$WP_PATH/wp-content/uploads" 2>/dev/null | head -20 || echo "no matches in uploads";

             echo "OK: diagnostic completed successfully"'
