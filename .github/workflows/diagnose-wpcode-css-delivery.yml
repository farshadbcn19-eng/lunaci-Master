name: Diagnose - how WPCode delivers .prod-img CSS (read-only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y > /dev/null
          npm install playwright@1.48.0 > /dev/null
          npx playwright install --with-deps chromium

      - name: Run diagnostic
        run: |
          mkdir -p /tmp/out
          node assets/luna-import/diagnose-wpcode-css-delivery.js

      - name: Commit results to diagnostics branch
        run: |
          set -e
          git config user.name "diagnostic-bot"
          git config user.email "diagnostic-bot@users.noreply.github.com"

          git checkout --orphan diagnostics/wpcode-css-delivery
          git rm -rf . > /dev/null 2>&1 || true

          cp /tmp/out/wpcode-css-delivery.json ./wpcode-css-delivery.json

          git add wpcode-css-delivery.json
          git commit -m "Diagnostic: how WPCode delivers .prod-img CSS (inline vs linked file, headers)"
          git push --force origin diagnostics/wpcode-css-delivery

          echo "OK: pushed diagnostics/wpcode-css-delivery branch"
