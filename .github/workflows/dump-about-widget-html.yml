name: Diagnose - dump full About Us widget HTML+CSS (read-only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Transfer diagnostic script and run it (read-only)
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          set -e

          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            -P "$SSH_PORT" "assets/luna-import/dump-about-widget-html.php" \
            "$SSH_USER@$SSH_HOST:/tmp/lunaimport-dump-about-widget-html.php"

          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then WP_PATH="$candidate"; break; fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then WP_PATH=$(dirname "$FOUND"); fi;
             fi;
             if [ -z "$WP_PATH" ]; then echo "ERROR: could not locate wp-config.php"; exit 1; fi;
             echo "WordPress found at: $WP_PATH";

             php -l /tmp/lunaimport-dump-about-widget-html.php;
             LINT_STATUS=$?;
             if [ "$LINT_STATUS" -ne 0 ]; then
               echo "ABORT: php -l failed";
               rm -f /tmp/lunaimport-dump-about-widget-html.php;
               exit 1;
             fi;

             wp eval-file /tmp/lunaimport-dump-about-widget-html.php --path="$WP_PATH" > /tmp/about-widget-dump.txt;
             EVAL_STATUS=$?;
             rm -f /tmp/lunaimport-dump-about-widget-html.php;
             if [ "$EVAL_STATUS" -ne 0 ]; then
               echo "ABORT: wp eval-file failed (exit code $EVAL_STATUS)";
               cat /tmp/about-widget-dump.txt;
               exit 1;
             fi;
             echo "OK: diagnostic completed successfully, dump saved"'

          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            -P "$SSH_PORT" "$SSH_USER@$SSH_HOST:/tmp/about-widget-dump.txt" \
            "/tmp/about-widget-dump.txt"

      - name: Commit dump to diagnostics branch
        run: |
          set -e
          git config user.name "diagnostic-bot"
          git config user.email "diagnostic-bot@users.noreply.github.com"

          git checkout --orphan diagnostics/about-widget-dump
          git rm -rf . > /dev/null 2>&1 || true

          cp /tmp/about-widget-dump.txt ./about-widget-dump.txt

          git add about-widget-dump.txt
          git commit -m "Diagnostic: full raw HTML+CSS dump of About Us widget (post 59, ce307e5)"
          git push --force origin diagnostics/about-widget-dump

          echo "OK: pushed diagnostics/about-widget-dump branch"
