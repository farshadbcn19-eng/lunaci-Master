name: Diagnose - find CSS rule overriding .prod-img height (read-only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y > /dev/null
          npm install playwright@1.48.0 > /dev/null
          npx playwright install --with-deps chromium

      - name: Run diagnostic
        run: |
          mkdir -p /tmp/out
          node assets/luna-import/find-prod-img-css-override.js

      - name: Commit results to diagnostics branch
        run: |
          set -e
          git config user.name "diagnostic-bot"
          git config user.email "diagnostic-bot@users.noreply.github.com"

          git checkout --orphan diagnostics/prod-img-css-override
          git rm -rf . > /dev/null 2>&1 || true

          cp /tmp/out/override-info.json ./override-info.json

          git add override-info.json
          git commit -m "Diagnostic: all CSS rules matching the Blusher prod-img element"
          git push --force origin diagnostics/prod-img-css-override

          echo "OK: pushed diagnostics/prod-img-css-override branch"
