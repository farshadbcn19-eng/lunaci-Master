name: Fix - Replace About Us "Our Story" image (import + fix EN+ES + cleanup, guarded)

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Upload new image, import to Media Library, patch fix script, run guarded fix
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          set -e

          echo "-- Uploading new story image --"
          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            -P "$SSH_PORT" "assets/luna-import/about-story-luna.jpg" \
            "$SSH_USER@$SSH_HOST:/tmp/lunaimport-about-story-luna.jpg"

          echo "-- Importing into Media Library and capturing the real GUID --"
          IMPORT_OUTPUT=$(sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then WP_PATH="$candidate"; break; fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then WP_PATH=$(dirname "$FOUND"); fi;
             fi;
             if [ -z "$WP_PATH" ]; then echo "ERROR: could not locate wp-config.php"; exit 1; fi;
             ATTACHMENT_ID=$(wp media import /tmp/lunaimport-about-story-luna.jpg --path="$WP_PATH" --porcelain);
             if [ -z "$ATTACHMENT_ID" ]; then echo "ERROR: wp media import did not return an attachment ID"; exit 1; fi;
             wp post get "$ATTACHMENT_ID" --field=guid --path="$WP_PATH"')

          echo "Import output (attachment GUID): $IMPORT_OUTPUT"
          NEW_URL=$(echo "$IMPORT_OUTPUT" | tail -1)
          if [ -z "$NEW_URL" ]; then
            echo "ABORT: could not determine the new image URL from wp media import"
            exit 1
          fi
          echo "Resolved new image URL: $NEW_URL"

          echo "-- Patching fix script with the real new image URL --"
          sed "s|^\\\$new_image_url\\s*=\\s*'__NEW_IMAGE_URL__';\$|\\\$new_image_url = '${NEW_URL}';|" \
            assets/luna-import/fix-about-story-image.php \
            > /tmp/fix-about-story-image-resolved.php

          if ! grep -qF "\$new_image_url = '${NEW_URL}';" /tmp/fix-about-story-image-resolved.php; then
            echo "ABORT: the assignment line was not substituted as expected"
            exit 1
          fi
          if grep -qF "__NEW_IMAGE_URL__" /tmp/fix-about-story-image-resolved.php; then
            echo "ABORT: placeholder still present elsewhere after substitution"
            exit 1
          fi
          echo "OK: fix script patched successfully"

          echo "-- Uploading patched fix script and running it --"
          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            -P "$SSH_PORT" "/tmp/fix-about-story-image-resolved.php" \
            "$SSH_USER@$SSH_HOST:/tmp/lunaimport-fix-about-story-image.php"

          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then WP_PATH="$candidate"; break; fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then WP_PATH=$(dirname "$FOUND"); fi;
             fi;
             if [ -z "$WP_PATH" ]; then echo "ERROR: could not locate wp-config.php"; exit 1; fi;
             echo "WordPress found at: $WP_PATH";

             php -l /tmp/lunaimport-fix-about-story-image.php;
             LINT_STATUS=$?;
             if [ "$LINT_STATUS" -ne 0 ]; then
               echo "ABORT: php -l failed";
               rm -f /tmp/lunaimport-fix-about-story-image.php;
               exit 1;
             fi;

             wp eval-file /tmp/lunaimport-fix-about-story-image.php --path="$WP_PATH";
             EVAL_STATUS=$?;
             rm -f /tmp/lunaimport-fix-about-story-image.php;
             if [ "$EVAL_STATUS" -ne 0 ]; then
               echo "ABORT: wp eval-file failed (exit code $EVAL_STATUS)";
               exit 1;
             fi;
             echo "OK: fix step completed";

             wp litespeed-purge all --path="$WP_PATH" || echo "WARNING: litespeed-purge command failed or not available"'
