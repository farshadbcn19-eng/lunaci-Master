name: Fix - repoint broken /collections-2 links to real Products/category pages (guarded write)

on:
  push:
    branches:
      - claude/lunaci-barcelona-audit-r9mp7s
    paths:
      - '.github/workflows/fix-collections2-links.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Repoint /collections-2 anchors on posts 57 (Home), 59 (About Us), 680 (Sobre Nosotros) by exact literal match, then clear Elementor cache
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then
                 WP_PATH="$candidate";
                 break;
               fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then WP_PATH=$(dirname "$FOUND"); fi;
             fi;
             if [ -z "$WP_PATH" ]; then echo "ERROR: could not locate wp-config.php"; exit 1; fi;
             echo "WordPress found at: $WP_PATH";

             echo "" | base64 -d > /tmp/fix-collections2-link.php;

             php -l /tmp/fix-collections2-link.php;
             LINT_STATUS=$?;
             if [ "$LINT_STATUS" -ne 0 ]; then
               echo "ABORT: php -l failed";
               rm -f /tmp/fix-collections2-link.php;
               exit 1;
             fi;

             wp eval-file /tmp/fix-collections2-link.php --path="$WP_PATH" > /tmp/fix-output.txt 2>&1;
             EVAL_STATUS=$?;
             cat /tmp/fix-output.txt;
             HAS_ABORT=$(grep -c "ABORT:" /tmp/fix-output.txt || true);
             rm -f /tmp/fix-collections2-link.php /tmp/fix-output.txt;
             if [ "$EVAL_STATUS" -ne 0 ]; then
               echo "FAIL: wp eval-file failed (exit code $EVAL_STATUS)";
               exit 1;
             fi;
             if [ "${HAS_ABORT:-0}" != "0" ]; then
               echo "FAIL: fix script reported ABORT in its output - see log above";
               exit 1;
             fi;
             echo "OK: workflow completed"'
