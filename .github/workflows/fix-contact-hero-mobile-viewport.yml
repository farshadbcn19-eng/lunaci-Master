name: Fix Contact hero mobile viewport (100vh -> 100dvh)

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Copy fix script to server
        run: |
          sshpass -p "${{ secrets.HOSTINGER_SSH_PASS }}" scp -o StrictHostKeyChecking=no \
            -P ${{ secrets.HOSTINGER_SSH_PORT }} \
            assets/luna-import/fix-contact-hero-mobile-viewport.php \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:/tmp/fix-contact-hero-mobile-viewport.php

      - name: Lint and run fix on server
        run: |
          sshpass -p "${{ secrets.HOSTINGER_SSH_PASS }}" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p ${{ secrets.HOSTINGER_SSH_PORT }} \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then
                 WP_PATH="$candidate";
                 break;
               fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" \
                 -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then
                 WP_PATH=$(dirname "$FOUND");
               fi;
             fi;
             if [ -z "$WP_PATH" ]; then
               echo "ERROR: could not locate wp-config.php under $HOME";
               exit 1;
             fi;
             echo "WordPress found at: $WP_PATH";

             php -l /tmp/fix-contact-hero-mobile-viewport.php;
             LINT_STATUS=$?;
             if [ "$LINT_STATUS" -ne 0 ]; then
               echo "ABORT: php -l failed on fix script";
               rm -f /tmp/fix-contact-hero-mobile-viewport.php;
               exit 1;
             fi;

             wp eval-file /tmp/fix-contact-hero-mobile-viewport.php --path="$WP_PATH";
             EVAL_STATUS=$?;
             rm -f /tmp/fix-contact-hero-mobile-viewport.php;
             if [ "$EVAL_STATUS" -ne 0 ]; then
               echo "ABORT: wp eval-file failed (exit code $EVAL_STATUS) - fix did NOT complete successfully";
               exit 1;
             fi;
             echo "OK: workflow completed successfully"'
