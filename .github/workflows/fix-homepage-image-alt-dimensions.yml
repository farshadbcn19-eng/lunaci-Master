name: "Fix - homepage image alt text and explicit dimensions"

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Upload script and run guarded fix
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          set -e

          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            -P "$SSH_PORT" "assets/luna-import/fix-homepage-image-alt-dimensions.php" \
            "$SSH_USER@$SSH_HOST:/tmp/lunaimport-fix-homepage-image-alt-dimensions.php"

          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then WP_PATH="$candidate"; break; fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then WP_PATH=$(dirname "$FOUND"); fi;
             fi;
             if [ -z "$WP_PATH" ]; then echo "ERROR: could not locate wp-config.php"; exit 1; fi;
             echo "WordPress found at: $WP_PATH";

             php -l /tmp/lunaimport-fix-homepage-image-alt-dimensions.php;
             LINT_STATUS=$?;
             if [ "$LINT_STATUS" -ne 0 ]; then
               echo "ABORT: php -l failed";
               rm -f /tmp/lunaimport-fix-homepage-image-alt-dimensions.php;
               exit 1;
             fi;

             wp eval-file /tmp/lunaimport-fix-homepage-image-alt-dimensions.php --path="$WP_PATH";
             EVAL_STATUS=$?;
             rm -f /tmp/lunaimport-fix-homepage-image-alt-dimensions.php;
             if [ "$EVAL_STATUS" -ne 0 ]; then
               echo "ABORT: wp eval-file failed (exit code $EVAL_STATUS)";
               exit 1;
             fi;

             echo "";
             echo "--- purging LiteSpeed cache (visible output) ---";
             wp litespeed-purge all --path="$WP_PATH";

             echo "--- flushing Elementor internal cache (needed for html-widget edits to render) ---";
             php -r "
             define(\"WP_USE_THEMES\", false);
             require(\"$WP_PATH/wp-load.php\");
             if (class_exists(\"\\\\Elementor\\\\Plugin\")) {
                 \$plugin = \\Elementor\\Plugin::instance();
                 if (isset(\$plugin->files_manager) && method_exists(\$plugin->files_manager, \"clear_cache\")) {
                     \$plugin->files_manager->clear_cache();
                     echo \"Elementor files cache cleared\\n\";
                 }
                 if (class_exists(\"\\\\Elementor\\\\Core\\\\Files\\\\CSS\\\\Post\")) {
                     foreach ([57, 772] as \$pid) {
                         \\Elementor\\Core\\Files\\CSS\\Post::create(\$pid)->delete();
                     }
                     echo \"Elementor per-post CSS cache cleared for 57, 772\\n\";
                 }
             } else {
                 echo \"Elementor Plugin class not found\\n\";
             }
             "

             echo "OK: fix completed successfully"'
