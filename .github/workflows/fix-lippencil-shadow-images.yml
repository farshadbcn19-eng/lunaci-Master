name: Fix - assign real product photos for Lip Pencil and Shadow (guarded write)

on:
  push:
    branches:
      - claude/lunaci-barcelona-audit-r9mp7s
    paths:
      - '.github/workflows/fix-lippencil-shadow-images.yml'
      - 'assets/product-photos/lunaci-shadow.jpg'
      - 'assets/product-photos/lunaci-lip-pencil.jpg'

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Copy product photos to server
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          sshpass -p "$SSH_PASS" scp -P "$SSH_PORT" -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            assets/product-photos/lunaci-shadow.jpg \
            assets/product-photos/lunaci-lip-pencil.jpg \
            "$SSH_USER@$SSH_HOST:/tmp/"

      - name: Import and assign featured images for products 491 (Lip Pencil) and 515 (Shadow), guarded against overwrite
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then
                 WP_PATH="$candidate";
                 break;
               fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then WP_PATH=$(dirname "$FOUND"); fi;
             fi;
             if [ -z "$WP_PATH" ]; then echo "ERROR: could not locate wp-config.php"; exit 1; fi;
             echo "WordPress found at: $WP_PATH";

             SHADOW_SIZE=$(stat -c%s /tmp/lunaci-shadow.jpg 2>/dev/null);
             LIPPENCIL_SIZE=$(stat -c%s /tmp/lunaci-lip-pencil.jpg 2>/dev/null);
             echo "uploaded files: shadow=$SHADOW_SIZE bytes, lip-pencil=$LIPPENCIL_SIZE bytes";
             if [ "$SHADOW_SIZE" -lt 50000 ] || [ "$LIPPENCIL_SIZE" -lt 50000 ]; then
               echo "ABORT: uploaded file suspiciously small, refusing to proceed";
               exit 1;
             fi;

             CUR_SHADOW_THUMB=$(wp post meta get 515 _thumbnail_id --path="$WP_PATH" 2>/dev/null);
             CUR_LIPPENCIL_THUMB=$(wp post meta get 491 _thumbnail_id --path="$WP_PATH" 2>/dev/null);
             echo "current _thumbnail_id: shadow(515)=[$CUR_SHADOW_THUMB] lip-pencil(491)=[$CUR_LIPPENCIL_THUMB]";
             if [ -n "$CUR_SHADOW_THUMB" ]; then
               echo "ABORT: product 515 (shadow) already has a _thumbnail_id set ($CUR_SHADOW_THUMB) - refusing to overwrite";
               exit 1;
             fi;
             if [ -n "$CUR_LIPPENCIL_THUMB" ]; then
               echo "ABORT: product 491 (lip-pencil) already has a _thumbnail_id set ($CUR_LIPPENCIL_THUMB) - refusing to overwrite";
               exit 1;
             fi;

             echo "--- importing shadow image ---";
             SHADOW_ATT_ID=$(wp media import /tmp/lunaci-shadow.jpg --post_id=515 --featured_image --porcelain --path="$WP_PATH");
             SHADOW_IMPORT_STATUS=$?;
             echo "shadow attachment id: $SHADOW_ATT_ID (exit=$SHADOW_IMPORT_STATUS)";
             if [ "$SHADOW_IMPORT_STATUS" -ne 0 ] || [ -z "$SHADOW_ATT_ID" ]; then
               echo "ABORT: wp media import failed for shadow";
               exit 1;
             fi;

             echo "--- importing lip-pencil image ---";
             LIPPENCIL_ATT_ID=$(wp media import /tmp/lunaci-lip-pencil.jpg --post_id=491 --featured_image --porcelain --path="$WP_PATH");
             LIPPENCIL_IMPORT_STATUS=$?;
             echo "lip-pencil attachment id: $LIPPENCIL_ATT_ID (exit=$LIPPENCIL_IMPORT_STATUS)";
             if [ "$LIPPENCIL_IMPORT_STATUS" -ne 0 ] || [ -z "$LIPPENCIL_ATT_ID" ]; then
               echo "ABORT: wp media import failed for lip-pencil";
               exit 1;
             fi;

             echo "--- verifying ---";
             VERIFY_SHADOW=$(wp post meta get 515 _thumbnail_id --path="$WP_PATH");
             VERIFY_LIPPENCIL=$(wp post meta get 491 _thumbnail_id --path="$WP_PATH");
             echo "verify: shadow _thumbnail_id=$VERIFY_SHADOW (expected $SHADOW_ATT_ID)";
             echo "verify: lip-pencil _thumbnail_id=$VERIFY_LIPPENCIL (expected $LIPPENCIL_ATT_ID)";
             if [ "$VERIFY_SHADOW" != "$SHADOW_ATT_ID" ] || [ "$VERIFY_LIPPENCIL" != "$LIPPENCIL_ATT_ID" ]; then
               echo "ABORT: verification failed - _thumbnail_id does not match imported attachment";
               exit 1;
             fi;

             rm -f /tmp/lunaci-shadow.jpg /tmp/lunaci-lip-pencil.jpg;
             echo "OK: both product images imported and set as featured image successfully"'
