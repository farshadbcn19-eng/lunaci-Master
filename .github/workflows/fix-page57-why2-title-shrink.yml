name: Fix - shrink page 57 why2 title font-size ~20% (guarded, no cache purge)

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Shrink .ln-why2__title font-size on page 57 (STEP A/B/C guarded)
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then
                 WP_PATH="$candidate";
                 break;
               fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" \
                 -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then
                 WP_PATH=$(dirname "$FOUND");
               fi;
             fi;
             if [ -z "$WP_PATH" ]; then
               echo "ERROR: could not locate wp-config.php under $HOME";
               exit 1;
             fi;
             echo "WordPress found at: $WP_PATH";

             echo "" | base64 -d > /tmp/lunaci-fix-page57-why2-title-shrink.php;

             php -l /tmp/lunaci-fix-page57-why2-title-shrink.php;
             LINT_STATUS=$?;
             if [ "$LINT_STATUS" -ne 0 ]; then
               echo "ABORT: php -l failed on fix script";
               rm -f /tmp/lunaci-fix-page57-why2-title-shrink.php;
               exit 1;
             fi;

             wp eval-file /tmp/lunaci-fix-page57-why2-title-shrink.php --path="$WP_PATH";
             EVAL_STATUS=$?;
             rm -f /tmp/lunaci-fix-page57-why2-title-shrink.php;
             if [ "$EVAL_STATUS" -ne 0 ]; then
               echo "ABORT: wp eval-file failed (exit code $EVAL_STATUS) - see log above for details";
               exit 1;
             fi;

             echo "OK: page 57 why2-title shrink step completed successfully"'
