name: Fix v2 - replace page 57 widget content (guarded, no cache purge)

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Replace settings.html for page 57 target widget v2 (STEP A/B/C guarded)
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then
                 WP_PATH="$candidate";
                 break;
               fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" \
                 -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then
                 WP_PATH=$(dirname "$FOUND");
               fi;
             fi;
             if [ -z "$WP_PATH" ]; then
               echo "ERROR: could not locate wp-config.php under $HOME";
               exit 1;
             fi;
             echo "WordPress found at: $WP_PATH";

             rm -f /tmp/lunaci-widget-content-v2.b64 /tmp/lunaci-widget-content-v2.html /tmp/lunaci-fix-page57-widget-v2.b64 /tmp/lunaci-fix-page57-widget-v2.php;

             echo "Reassembling new widget content (9 chunks)...";
             printf %s "" >> /tmp/lunaci-widget-content-v2.b64;
             printf %s "" >> /tmp/lunaci-widget-content-v2.b64;
             printf %s "" >> /tmp/lunaci-widget-content-v2.b64;
             printf %s "" >> /tmp/lunaci-widget-content-v2.b64;
             printf %s "" >> /tmp/lunaci-widget-content-v2.b64;
             printf %s "" >> /tmp/lunaci-widget-content-v2.b64;
             printf %s "" >> /tmp/lunaci-widget-content-v2.b64;
             printf %s "" >> /tmp/lunaci-widget-content-v2.b64;
             printf %s "" >> /tmp/lunaci-widget-content-v2.b64;
             base64 -d /tmp/lunaci-widget-content-v2.b64 > /tmp/lunaci-widget-content-v2.html;
             rm -f /tmp/lunaci-widget-content-v2.b64;
             echo "Reassembled content byte length: $(wc -c < /tmp/lunaci-widget-content-v2.html)";

             echo "-- Integrity check: sha256 of reassembled content --";
             ACTUAL_SHA256=$(sha256sum /tmp/lunaci-widget-content-v2.html | cut -d" " -f1);
             EXPECTED_SHA256="ff4e0ee657ca52bc29d507fb98244a0649c1af1112b8c873c5b34cc3f68e6216";
             echo "Actual:   $ACTUAL_SHA256";
             echo "Expected: $EXPECTED_SHA256";
             if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
               echo "ABORT: reassembled content sha256 mismatch - transfer corrupted, aborting before any DB write";
               rm -f /tmp/lunaci-widget-content-v2.html /tmp/lunaci-fix-page57-widget-v2.b64 /tmp/lunaci-fix-page57-widget-v2.php;
               exit 1;
             fi;
             echo "PASS: reassembled content sha256 matches expected value";

             echo "Reassembling PHP fix script (5 chunks)...";
             printf %s "" >> /tmp/lunaci-fix-page57-widget-v2.b64;
             printf %s "" >> /tmp/lunaci-fix-page57-widget-v2.b64;
             printf %s "" >> /tmp/lunaci-fix-page57-widget-v2.b64;
             printf %s "" >> /tmp/lunaci-fix-page57-widget-v2.b64;
             printf %s "" >> /tmp/lunaci-fix-page57-widget-v2.b64;
             base64 -d /tmp/lunaci-fix-page57-widget-v2.b64 > /tmp/lunaci-fix-page57-widget-v2.php;
             rm -f /tmp/lunaci-fix-page57-widget-v2.b64;

             php -l /tmp/lunaci-fix-page57-widget-v2.php;
             LINT_STATUS=$?;
             if [ "$LINT_STATUS" -ne 0 ]; then
               echo "ABORT: php -l failed on fix script";
               rm -f /tmp/lunaci-fix-page57-widget-v2.php /tmp/lunaci-widget-content-v2.html;
               exit 1;
             fi;

             wp eval-file /tmp/lunaci-fix-page57-widget-v2.php --path="$WP_PATH";
             EVAL_STATUS=$?;
             rm -f /tmp/lunaci-fix-page57-widget-v2.php /tmp/lunaci-widget-content-v2.html;
             if [ "$EVAL_STATUS" -ne 0 ]; then
               echo "ABORT: wp eval-file failed (exit code $EVAL_STATUS) - see log above for details";
               exit 1;
             fi;

             echo "OK: page 57 widget content v2 replacement step completed successfully"'
