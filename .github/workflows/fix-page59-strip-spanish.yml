name: Fix - strip Spanish text from page 59 (About Us) - guarded, all-or-nothing

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: STEP A/B/C - strip Spanish text from page 59 (all-or-nothing)
        id: write
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          set +e
          OUTPUT=$(sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then
                 WP_PATH="$candidate";
                 break;
               fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" \
                 -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then
                 WP_PATH=$(dirname "$FOUND");
               fi;
             fi;
             if [ -z "$WP_PATH" ]; then
               echo "ERROR: could not locate wp-config.php under $HOME";
               exit 1;
             fi;
             echo "WordPress found at: $WP_PATH";

             echo "" | base64 -d > /tmp/fix-page59-strip-spanish.php;

             php -l /tmp/fix-page59-strip-spanish.php;
             LINT_STATUS=$?;
             if [ "$LINT_STATUS" -ne 0 ]; then
               echo "ABORT: php -l failed on write script";
               rm -f /tmp/fix-page59-strip-spanish.php;
               exit 1;
             fi;

             wp eval-file /tmp/fix-page59-strip-spanish.php --path="$WP_PATH";
             EVAL_STATUS=$?;
             rm -f /tmp/fix-page59-strip-spanish.php;
             if [ "$EVAL_STATUS" -ne 0 ]; then
               echo "ABORT: wp eval-file failed (exit code $EVAL_STATUS) - see log above for details";
               exit 1;
             fi;

             echo "OK: guarded write step completed successfully"')
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            echo "ABORT: ssh/remote script failed with exit code $STATUS"
            echo "write_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if echo "$OUTPUT" | grep -q "FINAL RESULT: SUCCESS"; then
            echo "write_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "write_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge cache (both commands unconditionally, no exec()) - only if write succeeded
        if: steps.write.outputs.write_ok == 'true'
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then
                 WP_PATH="$candidate";
                 break;
               fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" \
                 -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then
                 WP_PATH=$(dirname "$FOUND");
               fi;
             fi;
             if [ -z "$WP_PATH" ]; then
               echo "ERROR: could not locate wp-config.php under $HOME";
               exit 1;
             fi;
             echo "WordPress found at: $WP_PATH";

             echo "";
             echo "==================== wp litespeed-purge all ====================";
             wp litespeed-purge all --path="$WP_PATH";
             echo "(exit code: $?)";

             echo "";
             echo "==================== wp cache flush (unconditional) ====================";
             wp cache flush --path="$WP_PATH";
             echo "(exit code: $?)";

             echo "";
             echo "OK: cache purge completed"'

      - name: Report skip reason if write did not succeed
        if: steps.write.outputs.write_ok != 'true'
        run: |
          echo "Cache purge SKIPPED because the guarded write did not report a SUCCESS marker (aborted or failed - see previous step's output for details)."
