name: Diagnose - inspect rendered HTML structure of Shipping page (read-only)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Fetch and grep live page structure via server-side curl
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          set -e
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'curl -s "https://lunacibarcelona.com/shipping/?nocache=$(date +%s)" -o /tmp/shipping-page.html;
             echo "--- body tag ---";
             grep -o "<body[^>]*>" /tmp/shipping-page.html || true;
             echo "";
             echo "--- main/article/content wrapper tags ---";
             grep -oE "<(main|article)[^>]*>" /tmp/shipping-page.html || true;
             echo "";
             echo "--- elements with class containing entry-content, page-content, elementor, content-area, site-main ---";
             grep -oE "<[a-z0-9]+[^>]*class=\"[^\"]*(entry-content|page-content|elementor|content-area|site-main|hero|page-header)[^\"]*\"[^>]*>" /tmp/shipping-page.html | sort -u || true;
             echo "";
             echo "--- h1 tags ---";
             grep -oE "<h1[^>]*>.{0,120}" /tmp/shipping-page.html || true;
             echo "";
             echo "--- bytes from <body> onward (first 3000) ---";
             BODY_OFFSET=$(grep -bo "<body" /tmp/shipping-page.html | head -1 | cut -d: -f1);
             if [ -n "$BODY_OFFSET" ]; then
               tail -c +$((BODY_OFFSET+1)) /tmp/shipping-page.html | head -c 3000;
             fi;
             echo "";
             rm -f /tmp/shipping-page.html'
