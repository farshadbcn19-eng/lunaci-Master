name: Isolate - test wpml_element_trid and wp_insert_post individually

on:
  push:
    branches:
      - claude/lunaci-barcelona-audit-r9mp7s
    paths:
      - '.github/workflows/isolate-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass
      - name: Run isolated test
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then WP_PATH="$candidate"; break; fi;
             done;
             echo "" | base64 -d > /tmp/isolate-test.php;
             php -l /tmp/isolate-test.php;
             wp eval-file /tmp/isolate-test.php --path="$WP_PATH" > /tmp/iso-out.txt 2>&1;
             echo "EXIT=$?";
             echo "--- output ---";
             cat /tmp/iso-out.txt;
             echo "--- size ---";
             wc -c /tmp/iso-out.txt;
             rm -f /tmp/isolate-test.php /tmp/iso-out.txt'
