name: Diagnose - measure Blusher image vs container dimensions (read-only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y > /dev/null
          npm install playwright@1.48.0 > /dev/null
          npx playwright install --with-deps chromium

      - name: Run measurement
        run: |
          mkdir -p /tmp/out
          node assets/luna-import/measure-blusher-frame.js

      - name: Commit results to diagnostics branch
        run: |
          set -e
          git config user.name "diagnostic-bot"
          git config user.email "diagnostic-bot@users.noreply.github.com"

          git checkout --orphan diagnostics/blusher-frame-measure
          git rm -rf . > /dev/null 2>&1 || true

          cp /tmp/out/*.png ./
          cp /tmp/out/measure-info.json ./measure-info.json

          git add *.png measure-info.json
          git commit -m "Diagnostic: Blusher image vs container dimension measurement"
          git push --force origin diagnostics/blusher-frame-measure

          echo "OK: pushed diagnostics/blusher-frame-measure branch"
