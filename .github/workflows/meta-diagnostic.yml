name: Meta App Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query Meta Graph API
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: |
          GV="v25.0"
          BUSINESS_ID="262540224272345"
          PAGE_ID_CLEAN=$(echo "$META_PAGE_ID" | tr -d '[:space:]')
          echo "## LUNACI Meta App Diagnostic Report" >> report.md
          echo "" >> report.md

          echo "### 1. System User Token validity" >> report.md
          curl -sg "https://graph.facebook.com/$GV/debug_token?input_token=$META_SYSTEM_USER_TOKEN&access_token=$META_APP_ID|$META_APP_SECRET" >> report.md
          echo "" >> report.md

          echo "### 2. Business Portfolio connection" >> report.md
          curl -sg "https://graph.facebook.com/$GV/$BUSINESS_ID?fields=name,verification_status&access_token=$META_SYSTEM_USER_TOKEN" >> report.md
          echo "" >> report.md

          echo "### 3. Page + Instagram Business Account link" >> report.md
          PAGE_TOKEN=$(curl -sg "https://graph.facebook.com/$GV/me/accounts?fields=name,id,access_token&access_token=$META_SYSTEM_USER_TOKEN" | jq -r --arg pid "$PAGE_ID_CLEAN" '.data[] | select(.id==$pid) | .access_token')
          if [ -z "$PAGE_TOKEN" ] || [ "$PAGE_TOKEN" = "null" ]; then
            echo "Could not extract Page Access Token for META_PAGE_ID" >> report.md
          else
            curl -sg "https://graph.facebook.com/$GV/$PAGE_ID_CLEAN?fields=name,instagram_business_account{id,username}&access_token=$PAGE_TOKEN" >> report.md
          fi
          echo "" >> report.md

          echo "### 4. Webhook subscriptions on Page" >> report.md
          if [ -z "$PAGE_TOKEN" ] || [ "$PAGE_TOKEN" = "null" ]; then
            echo "Skipped - no Page Access Token available" >> report.md
          else
            curl -sg "https://graph.facebook.com/$GV/$PAGE_ID_CLEAN/subscribed_apps?access_token=$PAGE_TOKEN" >> report.md
          fi
          echo "" >> report.md

          echo "### 5. List of Pages owned by this Business" >> report.md
          curl -sg "https://graph.facebook.com/$GV/$BUSINESS_ID/owned_pages?fields=id,name&access_token=$META_SYSTEM_USER_TOKEN" >> report.md
          echo "" >> report.md

          echo "### 6. Pages accessible via /me/accounts" >> report.md
          curl -sg "https://graph.facebook.com/$GV/me/accounts?fields=name,id&access_token=$META_SYSTEM_USER_TOKEN" >> report.md
          echo "" >> report.md

          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: meta-diagnostic-report
          path: report.md
          retention-days: 14
