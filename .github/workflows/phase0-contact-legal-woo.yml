name: "Phase 0 - Contact, legal, footer, WooCommerce (dry-run / apply)"

# Brief: LUNACI_Phase0_ClaudeCode_Brief_2026-10-01
# Run 1: mode=dry-run (read-only diagnose; prints every change it would make).
# Run 2: mode=apply   (backs up every post/option/file it touches, then writes).
# Backups are kept on the server in ~/lunaci-backups/phase0-<timestamp>/
# (outside public_html) and also attached to the run as an artifact.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = read-only diagnose, apply = backup + write"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

jobs:
  phase0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Build remote runner script
        run: |
          cat > /tmp/lunaimport-phase0-remote.sh <<'REMOTE'
          #!/bin/bash
          MODE="$1"
          TS="$(date -u +%Y%m%d-%H%M%S)"

          WP_PATH=""
          for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
            if [ -f "$candidate/wp-config.php" ]; then WP_PATH="$candidate"; break; fi
          done
          if [ -z "$WP_PATH" ]; then
            FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then WP_PATH=$(dirname "$FOUND"); fi
          fi
          if [ -z "$WP_PATH" ]; then echo "ERROR: could not locate wp-config.php"; exit 1; fi
          echo "WordPress found at: $WP_PATH"
          echo "MODE: $MODE"

          home_md5() {
            wp eval 'foreach ( array( 57, 772 ) as $id ) { echo $id . ":" . md5( (string) get_post_meta( $id, "_elementor_data", true ) ) . " "; }' --path="$WP_PATH" 2>/dev/null
          }
          HOME_BEFORE="$(home_md5)"
          echo "HOME_BASELINE (before): $HOME_BEFORE"

          BACKUP_DIR=""
          if [ "$MODE" = "apply" ]; then
            BACKUP_DIR="$HOME/lunaci-backups/phase0-$TS"
            mkdir -p "$BACKUP_DIR/webroot" "$BACKUP_DIR/wp-post-get" || { echo "ABORT: cannot create $BACKUP_DIR"; exit 1; }
            echo "BACKUP DIR: $BACKUP_DIR"
            for id in 60 770 59 680 3 676 759 760 769 768 765 766 515 57 772; do
              wp post get "$id" --format=json --path="$WP_PATH" > "$BACKUP_DIR/wp-post-get/post-$id.json" 2>/dev/null \
                && echo "wp post get $id -> backed up" || echo "WARN: wp post get $id failed"
            done
          fi

          echo ""
          echo "==================== LEGACY STATIC FILES IN WEB ROOT ===================="
          STATIC_FOUND=0
          for f in contact.html index.html products.html shop.html; do
            if [ -f "$WP_PATH/$f" ]; then
              STATIC_FOUND=1
              ls -la "$WP_PATH/$f"
              md5sum "$WP_PATH/$f"
            else
              echo "not present: $f"
            fi
          done

          echo ""
          echo "==================== PHP SCRIPT ===================="
          php -l /tmp/lunaimport-phase0.php || { echo "ABORT: php -l failed"; rm -f /tmp/lunaimport-phase0.php; exit 1; }
          wp eval-file /tmp/lunaimport-phase0.php "$MODE" "$BACKUP_DIR" --path="$WP_PATH"
          EVAL_STATUS=$?
          rm -f /tmp/lunaimport-phase0.php
          echo "wp eval-file exit code: $EVAL_STATUS"

          if [ "$MODE" = "apply" ] && [ "$STATIC_FOUND" = "1" ]; then
            echo ""
            echo "==================== BACKUP + DELETE STATIC FILES ===================="
            for f in contact.html index.html products.html shop.html; do
              if [ -f "$WP_PATH/$f" ]; then
                cp -p "$WP_PATH/$f" "$BACKUP_DIR/webroot/$f" \
                  && cmp -s "$WP_PATH/$f" "$BACKUP_DIR/webroot/$f" \
                  && rm -f "$WP_PATH/$f" \
                  && echo "backed up + deleted: $f" \
                  || echo "ERROR: backup/delete failed for $f - left in place"
              fi
            done
          fi

          if [ "$MODE" = "apply" ]; then
            wp litespeed-purge all --path="$WP_PATH" || true
            tar -czf /tmp/lunaimport-phase0-backup.tgz -C "$(dirname "$BACKUP_DIR")" "$(basename "$BACKUP_DIR")"
            echo "backup tarball: /tmp/lunaimport-phase0-backup.tgz"
          fi

          HOME_AFTER="$(home_md5)"
          echo ""
          echo "HOME_BASELINE (after):  $HOME_AFTER"
          if [ "$HOME_BEFORE" = "$HOME_AFTER" ]; then
            echo "OK: Home 57/772 _elementor_data unchanged"
          else
            echo "ERROR: Home 57/772 _elementor_data CHANGED"
            exit 1
          fi

          if [ "$EVAL_STATUS" -ne 0 ]; then
            echo "RESULT: PHP script reported failures (exit $EVAL_STATUS) - see log"
            exit "$EVAL_STATUS"
          fi
          echo "RESULT: OK ($MODE)"
          REMOTE

      - name: Run on server
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          MODE: ${{ inputs.mode }}
        run: |
          set -e
          scp_p() { sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -o ConnectTimeout=15 -P "$SSH_PORT" "$@"; }
          scp_p "assets/luna-import/phase0-contact-legal-woo.php" "$SSH_USER@$SSH_HOST:/tmp/lunaimport-phase0.php"
          scp_p "/tmp/lunaimport-phase0-remote.sh" "$SSH_USER@$SSH_HOST:/tmp/lunaimport-phase0-remote.sh"

          set +e
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "bash /tmp/lunaimport-phase0-remote.sh '$MODE'; S=\$?; rm -f /tmp/lunaimport-phase0-remote.sh; exit \$S"
          STATUS=$?
          set -e

          if [ "$MODE" = "apply" ]; then
            scp_p "$SSH_USER@$SSH_HOST:/tmp/lunaimport-phase0-backup.tgz" ./phase0-backup.tgz || echo "WARN: could not fetch backup tarball"
            sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "rm -f /tmp/lunaimport-phase0-backup.tgz" || true
          fi
          exit $STATUS

      - name: Upload backup as artifact
        if: ${{ always() && inputs.mode == 'apply' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase0-backup
          path: phase0-backup.tgz
          if-no-files-found: warn
          retention-days: 90
