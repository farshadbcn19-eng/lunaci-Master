name: "Phase 1 - Contact form handler, Returns clause, content cleanup (dry-run / apply)"

# Run 1: mode=dry-run (read-only; prints every change it would make).
# Run 2: mode=apply   (deploys mu-plugins/lunaci-contact-form.php, backs up
#        every post it touches, writes, then sends one real end-to-end test
#        message through the live form and deletes the stored test copy).
# Backups: ~/lunaci-backups/phase1-<timestamp>/ on the server (outside
# public_html) and the phase1-backup artifact on the run.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = read-only diagnose, apply = backup + write"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Build remote runner script
        run: |
          cat > /tmp/lunaimport-phase1-remote.sh <<'REMOTE'
          #!/bin/bash
          MODE="$1"
          TS="$(date -u +%Y%m%d-%H%M%S)"

          WP_PATH=""
          for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
            if [ -f "$candidate/wp-config.php" ]; then WP_PATH="$candidate"; break; fi
          done
          if [ -z "$WP_PATH" ]; then
            FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then WP_PATH=$(dirname "$FOUND"); fi
          fi
          if [ -z "$WP_PATH" ]; then echo "ERROR: could not locate wp-config.php"; exit 1; fi
          echo "WordPress found at: $WP_PATH"
          echo "MODE: $MODE"

          home_md5() {
            wp eval 'foreach ( array( 57, 772 ) as $id ) { echo $id . ":" . md5( (string) get_post_meta( $id, "_elementor_data", true ) ) . " "; }' --path="$WP_PATH" 2>/dev/null
          }
          HOME_BEFORE="$(home_md5)"
          echo "HOME_BASELINE (before): $HOME_BEFORE"

          BACKUP_DIR=""
          if [ "$MODE" = "apply" ]; then
            BACKUP_DIR="$HOME/lunaci-backups/phase1-$TS"
            mkdir -p "$BACKUP_DIR/webroot" "$BACKUP_DIR/wp-post-get" || { echo "ABORT: cannot create $BACKUP_DIR"; exit 1; }
            echo "BACKUP DIR: $BACKUP_DIR"
            for id in 60 770 59 680 760 766 57 772; do
              wp post get "$id" --format=json --path="$WP_PATH" > "$BACKUP_DIR/wp-post-get/post-$id.json" 2>/dev/null \
                && echo "wp post get $id -> backed up" || echo "WARN: wp post get $id failed"
            done
          fi

          echo ""
          echo "==================== MU-PLUGIN: lunaci-contact-form.php ===================="
          MU_DIR="$WP_PATH/wp-content/mu-plugins"
          MU_FILE="$MU_DIR/lunaci-contact-form.php"
          php -l /tmp/lunaimport-phase1-mu.php || { echo "ABORT: php -l failed on mu-plugin"; rm -f /tmp/lunaimport-phase1-*.php; exit 1; }
          if [ -f "$MU_FILE" ]; then
            echo "present: $(md5sum "$MU_FILE" | cut -d' ' -f1) (repo: $(md5sum /tmp/lunaimport-phase1-mu.php | cut -d' ' -f1))"
          else
            echo "not present yet"
          fi
          if [ "$MODE" = "apply" ]; then
            mkdir -p "$MU_DIR" "$BACKUP_DIR/mu-plugins"
            [ -f "$MU_FILE" ] && cp -p "$MU_FILE" "$BACKUP_DIR/mu-plugins/"
            cp /tmp/lunaimport-phase1-mu.php "$MU_FILE" && echo "deployed: $MU_FILE" || { echo "ABORT: could not deploy mu-plugin"; exit 1; }
          fi
          rm -f /tmp/lunaimport-phase1-mu.php

          echo ""
          echo "==================== PHP SCRIPT ===================="
          php -l /tmp/lunaimport-phase1.php || { echo "ABORT: php -l failed"; rm -f /tmp/lunaimport-phase1.php; exit 1; }
          wp eval-file /tmp/lunaimport-phase1.php "$MODE" "$BACKUP_DIR" --path="$WP_PATH"
          EVAL_STATUS=$?
          rm -f /tmp/lunaimport-phase1.php
          echo "wp eval-file exit code: $EVAL_STATUS"

          if [ "$MODE" = "apply" ]; then
            wp litespeed-purge all --path="$WP_PATH" || true
            tar -czf /tmp/lunaimport-phase1-backup.tgz -C "$(dirname "$BACKUP_DIR")" "$(basename "$BACKUP_DIR")"
            echo "backup tarball: /tmp/lunaimport-phase1-backup.tgz"
          fi

          HOME_AFTER="$(home_md5)"
          echo ""
          echo "HOME_BASELINE (after):  $HOME_AFTER"
          if [ "$HOME_BEFORE" = "$HOME_AFTER" ]; then
            echo "OK: Home 57/772 _elementor_data unchanged"
          else
            echo "ERROR: Home 57/772 _elementor_data CHANGED"
            exit 1
          fi

          if [ "$EVAL_STATUS" -ne 0 ]; then
            echo "RESULT: PHP script reported failures (exit $EVAL_STATUS) - see log"
            exit "$EVAL_STATUS"
          fi
          echo "RESULT: OK ($MODE)"
          REMOTE

      - name: Run on server
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          MODE: ${{ inputs.mode }}
        run: |
          set -e
          scp_p() { sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -o ConnectTimeout=15 -P "$SSH_PORT" "$@"; }
          scp_p "assets/luna-import/phase1-contact-form-returns-cleanup.php" "$SSH_USER@$SSH_HOST:/tmp/lunaimport-phase1.php"
          scp_p "mu-plugins/lunaci-contact-form.php" "$SSH_USER@$SSH_HOST:/tmp/lunaimport-phase1-mu.php"
          scp_p "/tmp/lunaimport-phase1-remote.sh" "$SSH_USER@$SSH_HOST:/tmp/lunaimport-phase1-remote.sh"

          set +e
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "bash /tmp/lunaimport-phase1-remote.sh '$MODE'; S=\$?; rm -f /tmp/lunaimport-phase1-remote.sh; exit \$S"
          STATUS=$?
          set -e

          if [ "$MODE" = "apply" ]; then
            scp_p "$SSH_USER@$SSH_HOST:/tmp/lunaimport-phase1-backup.tgz" ./phase1-backup.tgz || echo "WARN: could not fetch backup tarball"
            sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "rm -f /tmp/lunaimport-phase1-backup.tgz" || true
          fi
          exit $STATUS

      - name: End-to-end test of the live form (apply only)
        if: ${{ inputs.mode == 'apply' }}
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          BASE="https://lunacibarcelona.com"
          TS="$(date +%s)"
          FAIL=0
          for p in /contact/ /es/contacto/; do
            N=$(curl -sS -m 30 "$BASE$p?nocache=$TS" | grep -c 'name="lunaci_cf"')
            if [ "$N" = "1" ]; then echo "PASS  $p renders the form"; else echo "FAIL  $p form markup count=$N"; FAIL=1; fi
          done
          N=$(curl -sS -m 30 "$BASE/returns/?nocache=$TS" | grep -c 'For health and hygiene reasons')
          if [ "$N" != "0" ]; then echo "PASS  /returns/ hygiene clause"; else echo "FAIL  /returns/ hygiene clause missing"; FAIL=1; fi
          N=$(curl -sS -m 30 "$BASE/es/devoluciones/?nocache=$TS" | grep -c 'Por motivos de protección de la salud')
          if [ "$N" != "0" ]; then echo "PASS  /es/devoluciones/ hygiene clause"; else echo "FAIL  /es/devoluciones/ hygiene clause missing"; FAIL=1; fi

          OUT=$(curl -sS -m 30 -o /dev/null -w "%{http_code} %{redirect_url}" -X POST "$BASE/contact/" \
            --data-urlencode "lunaci_cf=1" --data-urlencode "lang=en" --data-urlencode "lc_js=ok" --data-urlencode "website=" \
            --data-urlencode "first_name=Deployment" --data-urlencode "last_name=Test" \
            --data-urlencode "email=info@lunacibarcelona.com" --data-urlencode "subject=other" \
            --data-urlencode "message=Automated deployment test of the LUNACI contact form (run $GITHUB_RUN_ID). No action needed." \
            --data-urlencode "consent=1")
          echo "POST /contact/ -> $OUT"
          case "$OUT" in
            "303 "*enquiry=sent*) echo "PASS  form submission accepted" ;;
            *) echo "FAIL  form submission not accepted"; FAIL=1 ;;
          esac

          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" '
            WP_PATH=$(dirname "$(find -L "$HOME" -maxdepth 8 -name wp-config.php -not -path "*/wp-content/*" 2>/dev/null | head -1)");
            wp eval '"'"'
              $q = get_posts( array( "post_type" => "lunaci_enquiry", "post_status" => "any", "posts_per_page" => 1, "s" => "Automated deployment test" ) );
              if ( ! $q ) { echo "FAIL  test enquiry not stored\n"; exit( 1 ); }
              $sent = get_post_meta( $q[0]->ID, "_lunaci_mail_sent", true );
              echo "PASS  test enquiry stored (#" . $q[0]->ID . ")\n";
              echo ( "1" === $sent ? "PASS  wp_mail accepted the email to info@lunacibarcelona.com" : "WARN  wp_mail returned false - check mail delivery (SMTP)" ) . "\n";
              wp_delete_post( $q[0]->ID, true );
              echo "cleaned up test enquiry\n";
            '"'"' --path="$WP_PATH"' || FAIL=1

          if [ "$FAIL" = "0" ]; then echo "RESULT: ALL CHECKS PASSED"; else echo "RESULT: SOME CHECKS FAILED"; exit 1; fi

      - name: Upload backup as artifact
        if: ${{ always() && inputs.mode == 'apply' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase1-backup
          path: phase1-backup.tgz
          if-no-files-found: warn
          retention-days: 90
