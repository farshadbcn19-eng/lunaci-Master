name: "Phase 2 - Home footer, shipping zones, Stripe test mode (dry-run / apply)"

# Run 1: mode=dry-run (read-only; prints every change it would make).
# Run 2: mode=apply   (installs/activates the free WooCommerce Stripe plugin,
#        backs up, writes Home footer + shipping zones + Stripe test-mode
#        settings, then tests shipping rates through the live Store API).
# Backups: ~/lunaci-backups/phase2-<timestamp>/ and the phase2-backup artifact.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = read-only diagnose, apply = backup + write"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Build remote runner script
        run: |
          cat > /tmp/lunaimport-phase2-remote.sh <<'REMOTE'
          #!/bin/bash
          MODE="$1"
          TS="$(date -u +%Y%m%d-%H%M%S)"

          WP_PATH=""
          for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
            if [ -f "$candidate/wp-config.php" ]; then WP_PATH="$candidate"; break; fi
          done
          if [ -z "$WP_PATH" ]; then
            FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then WP_PATH=$(dirname "$FOUND"); fi
          fi
          if [ -z "$WP_PATH" ]; then echo "ERROR: could not locate wp-config.php"; exit 1; fi
          echo "WordPress found at: $WP_PATH"
          echo "MODE: $MODE"

          home_md5() {
            wp eval 'foreach ( array( 57, 772 ) as $id ) { echo $id . ":" . md5( (string) get_post_meta( $id, "_elementor_data", true ) ) . " "; }' --path="$WP_PATH" 2>/dev/null
          }
          HOME_BEFORE="$(home_md5)"
          echo "HOME_BASELINE (before): $HOME_BEFORE"

          BACKUP_DIR=""
          if [ "$MODE" = "apply" ]; then
            BACKUP_DIR="$HOME/lunaci-backups/phase2-$TS"
            mkdir -p "$BACKUP_DIR/webroot" "$BACKUP_DIR/wp-post-get" || { echo "ABORT: cannot create $BACKUP_DIR"; exit 1; }
            echo "BACKUP DIR: $BACKUP_DIR"
            for id in 57 772; do
              wp post get "$id" --format=json --path="$WP_PATH" > "$BACKUP_DIR/wp-post-get/post-$id.json" 2>/dev/null \
                && echo "wp post get $id -> backed up" || echo "WARN: wp post get $id failed"
            done
          fi

          echo ""
          echo "==================== PLUGIN: woocommerce-gateway-stripe ===================="
          if wp plugin is-installed woocommerce-gateway-stripe --path="$WP_PATH"; then
            wp plugin list --name=woocommerce-gateway-stripe --fields=name,status,version --path="$WP_PATH"
          else
            echo "not installed"
          fi
          if [ "$MODE" = "apply" ]; then
            if ! wp plugin is-installed woocommerce-gateway-stripe --path="$WP_PATH"; then
              wp plugin install woocommerce-gateway-stripe --path="$WP_PATH" || { echo "ABORT: plugin install failed"; exit 1; }
            fi
            wp plugin activate woocommerce-gateway-stripe --path="$WP_PATH" || { echo "ABORT: plugin activation failed"; exit 1; }
            wp plugin list --name=woocommerce-gateway-stripe --fields=name,status,version --path="$WP_PATH"
          fi

          echo ""
          echo "==================== PHP SCRIPT ===================="
          php -l /tmp/lunaimport-phase2.php || { echo "ABORT: php -l failed"; rm -f /tmp/lunaimport-phase2.php; exit 1; }
          wp eval-file /tmp/lunaimport-phase2.php "$MODE" "$BACKUP_DIR" --path="$WP_PATH"
          EVAL_STATUS=$?
          rm -f /tmp/lunaimport-phase2.php
          echo "wp eval-file exit code: $EVAL_STATUS"

          if [ "$MODE" = "apply" ]; then
            wp litespeed-purge all --path="$WP_PATH" || true
            tar -czf /tmp/lunaimport-phase2-backup.tgz -C "$(dirname "$BACKUP_DIR")" "$(basename "$BACKUP_DIR")"
            echo "backup tarball: /tmp/lunaimport-phase2-backup.tgz"
          fi

          HOME_AFTER="$(home_md5)"
          echo ""
          echo "HOME_BASELINE (after):  $HOME_AFTER"
          echo "(Home changes in apply mode by design: footer social block only, verified inside the PHP script)"

          if [ "$EVAL_STATUS" -ne 0 ]; then
            echo "RESULT: PHP script reported failures (exit $EVAL_STATUS) - see log"
            exit "$EVAL_STATUS"
          fi
          echo "RESULT: OK ($MODE)"
          REMOTE

      - name: Run on server
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          MODE: ${{ inputs.mode }}
        run: |
          set -e
          scp_p() { sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -o ConnectTimeout=15 -P "$SSH_PORT" "$@"; }
          scp_p "assets/luna-import/phase2-home-footer-shipping-stripe.php" "$SSH_USER@$SSH_HOST:/tmp/lunaimport-phase2.php"
          scp_p "/tmp/lunaimport-phase2-remote.sh" "$SSH_USER@$SSH_HOST:/tmp/lunaimport-phase2-remote.sh"

          set +e
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "bash /tmp/lunaimport-phase2-remote.sh '$MODE'; S=\$?; rm -f /tmp/lunaimport-phase2-remote.sh; exit \$S"
          STATUS=$?
          set -e

          if [ "$MODE" = "apply" ]; then
            scp_p "$SSH_USER@$SSH_HOST:/tmp/lunaimport-phase2-backup.tgz" ./phase2-backup.tgz || echo "WARN: could not fetch backup tarball"
            sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "rm -f /tmp/lunaimport-phase2-backup.tgz" || true
          fi
          exit $STATUS

      - name: Live checks - Home footer and shipping rates via Store API (apply only)
        if: ${{ inputs.mode == 'apply' }}
        run: |
          BASE="https://lunacibarcelona.com"
          TS="$(date +%s)"
          FAIL=0
          for p in / /es/; do
            PAGE=$(curl -sS -m 30 "$BASE$p?nocache=$TS")
            if echo "$PAGE" | grep -q 'instagram.com/lunaci.barcelona/' && ! echo "$PAGE" | grep -q '>TK<' && ! echo "$PAGE" | grep -q '<a href="#">IG</a>'; then
              echo "PASS  $p footer social links"
            else
              echo "FAIL  $p footer social links"; FAIL=1
            fi
          done

          J=$(mktemp)
          NONCE=$(curl -sS -m 30 -c "$J" -b "$J" -D - -o /dev/null "$BASE/wp-json/wc/store/v1/cart" | grep -i '^nonce:' | awk '{print $2}' | tr -d '\r')
          curl -sS -m 30 -c "$J" -b "$J" -H "Nonce: $NONCE" -H 'Content-Type: application/json' \
            -d '{"id":501,"quantity":1}' "$BASE/wp-json/wc/store/v1/cart/add-item" -o /dev/null

          check_rates() {
            curl -sS -m 30 -c "$J" -b "$J" -H "Nonce: $NONCE" -H 'Content-Type: application/json' \
              -d "{\"shipping_address\":{\"first_name\":\"Test\",\"last_name\":\"Test\",\"address_1\":\"Test 1\",\"city\":\"$4\",\"state\":\"$2\",\"postcode\":\"$3\",\"country\":\"$1\"}}" \
              "$BASE/wp-json/wc/store/v1/cart/update-customer" -o cart.json
            python3 - "$1/$2" "$5" <<'PY'
          import json, sys
          label, expect = sys.argv[1], sys.argv[2]
          cart = json.load(open('cart.json'))
          rates = [r for pkg in cart.get('shipping_rates', []) for r in pkg.get('shipping_rates', [])]
          shown = [f"{r['method_id']}={int(r['price'])/100:.2f}" for r in rates]
          print(f"  {label}: {shown or 'no rates'}  payment methods: {cart.get('payment_methods')}")
          ok = {'none': not rates,
                'free': any(r['method_id'] == 'free_shipping' and int(r['price']) == 0 for r in rates),
                'flat1490': any(r['method_id'] == 'flat_rate' and int(r['price']) == 1490 for r in rates)}[expect]
          print(('PASS' if ok else 'FAIL') + f"  {label} expected {expect}")
          sys.exit(0 if ok else 1)
          PY
          }
          check_rates ES M 28001 Madrid free || FAIL=1
          check_rates ES PM 07001 Palma free || FAIL=1
          check_rates DE "" 10115 Berlin flat1490 || FAIL=1
          check_rates FR "" 75001 Paris flat1490 || FAIL=1
          check_rates ES GC 35001 "Las Palmas" none || FAIL=1

          if [ "$FAIL" = "0" ]; then echo "RESULT: ALL CHECKS PASSED"; else echo "RESULT: SOME CHECKS FAILED"; exit 1; fi

      - name: Upload backup as artifact
        if: ${{ always() && inputs.mode == 'apply' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase2-backup
          path: phase2-backup.tgz
          if-no-files-found: warn
          retention-days: 90
