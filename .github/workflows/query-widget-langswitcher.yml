name: Query - widget areas, snippets, WPML settings, homepage footer HTML (read-only)

on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: TASKS 1-3 - wp-cli read-only queries (widgets, snippets, WPML settings)
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'WP_PATH="";
             for candidate in "$HOME/public_html" "$HOME" "$(pwd)"; do
               if [ -f "$candidate/wp-config.php" ]; then
                 WP_PATH="$candidate";
                 break;
               fi;
             done;
             if [ -z "$WP_PATH" ]; then
               FOUND=$(find -L "$HOME" -maxdepth 8 -name "wp-config.php" \
                 -not -path "*/wp-content/*" -not -path "*/node_modules/*" 2>/dev/null | head -1);
               if [ -n "$FOUND" ]; then
                 WP_PATH=$(dirname "$FOUND");
               fi;
             fi;
             if [ -z "$WP_PATH" ]; then
               echo "ERROR: could not locate wp-config.php under $HOME";
               exit 1;
             fi;
             echo "WordPress found at: $WP_PATH";

             echo "" | base64 -d > /tmp/query-widget-langswitcher.php;

             php -l /tmp/query-widget-langswitcher.php;
             LINT_STATUS=$?;
             if [ "$LINT_STATUS" -ne 0 ]; then
               echo "ABORT: php -l failed on query script";
               rm -f /tmp/query-widget-langswitcher.php;
               exit 1;
             fi;

             wp eval-file /tmp/query-widget-langswitcher.php --path="$WP_PATH";
             EVAL_STATUS=$?;
             rm -f /tmp/query-widget-langswitcher.php;
             if [ "$EVAL_STATUS" -ne 0 ]; then
               echo "ABORT: wp eval-file failed (exit code $EVAL_STATUS) - see log above for details";
               exit 1;
             fi;

             echo "OK: TASKS 1-3 completed successfully"'

      - name: TASK 4 - curl homepage from the server and extract footer markup around "All rights reserved" and any language/flag switcher
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'curl -s -A "Mozilla/5.0 (compatible; diagnostic-fetch)" https://lunacibarcelona.com/ -o /tmp/lunaci-homepage.html;
             CURL_STATUS=$?;
             if [ "$CURL_STATUS" -ne 0 ] || [ ! -s /tmp/lunaci-homepage.html ]; then
               echo "ERROR: curl fetch of homepage failed (status=$CURL_STATUS) or empty response";
               exit 1;
             fi;
             echo "Fetched homepage, size: $(wc -c < /tmp/lunaci-homepage.html) bytes";

             echo "";
             echo "==================== Context around \"All rights reserved\" ====================";
             grep -n -i -B 15 -A 15 "all rights reserved" /tmp/lunaci-homepage.html || echo "(no match for \"all rights reserved\")";

             echo "";
             echo "==================== Context around language/flag-switcher markers ====================";
             for marker in "wpml-ls" "language-switcher" "icl-lang" "icl_lang" "lang-switch" "flag-icon" "iti-flag" "wpml_language_switcher"; do
               echo "--- marker: $marker ---";
               grep -n -i -B 10 -A 10 "$marker" /tmp/lunaci-homepage.html || echo "  (no match)";
             done;

             rm -f /tmp/lunaci-homepage.html;
             echo "OK: TASK 4 completed successfully"'
