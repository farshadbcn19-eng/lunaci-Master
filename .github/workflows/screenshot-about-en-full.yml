name: Screenshot About Us EN full page (read-only)

on:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Playwright + Chromium
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run screenshot script against live EN About Us page
        run: node assets/luna-import/screenshot-about-en-full.js

      - name: Upload screenshot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: about-en-full-screenshot
          path: about-en-desktop-fullpage.png
          retention-days: 1
