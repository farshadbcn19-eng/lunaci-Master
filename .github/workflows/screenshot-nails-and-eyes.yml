name: Diagnose - screenshot Nails banner + Eyes category page (read-only)

on:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Playwright + Chromium
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run screenshot script against live pages (cache-busted)
        run: node assets/luna-import/screenshot-nails-and-eyes.js

      - name: Upload screenshots as artifact
        uses: actions/upload-artifact@v4
        with:
          name: category-screenshots
          path: |
            nails-banner-crop.png
            nails-category-fullpage.png
            eyes-category-fullpage.png
          retention-days: 1
