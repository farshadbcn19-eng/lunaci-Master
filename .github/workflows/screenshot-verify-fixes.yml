name: Screenshot verify Products/Contact fixes

on:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Playwright + Chromium
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run screenshot verification against live pages
        run: node assets/luna-import/screenshot-verify-fixes.js

      - name: Upload screenshots as artifact
        uses: actions/upload-artifact@v4
        with:
          name: verify-fixes-screenshots
          path: |
            *.png
          retention-days: 1
