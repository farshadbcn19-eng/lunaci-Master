name: Verify - About Us hero mobile crop fix render check (read-only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y > /dev/null
          npm install playwright@1.48.0 > /dev/null
          npx playwright install --with-deps chromium

      - name: Run verification
        run: |
          mkdir -p /tmp/out
          node assets/luna-import/screenshot-about-hero-crop-verify.js

      - name: Commit screenshots to diagnostics branch
        run: |
          set -e
          git config user.name "diagnostic-bot"
          git config user.email "diagnostic-bot@users.noreply.github.com"

          git checkout --orphan diagnostics/about-hero-crop-verify
          git rm -rf . > /dev/null 2>&1 || true

          cp /tmp/out/*.png ./

          git add *.png
          git commit -m "Verification: About Us hero mobile crop fix render check"
          git push --force origin diagnostics/about-hero-crop-verify

          echo "OK: pushed diagnostics/about-hero-crop-verify branch"
