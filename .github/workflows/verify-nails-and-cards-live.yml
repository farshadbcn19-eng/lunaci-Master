name: Diagnose - verify Nails crop + Eyes cards live, cache-busted (read-only)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Playwright + Chromium
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run verification script against live pages (cache-busted)
        run: node assets/luna-import/verify-nails-and-cards-live.js
