name: "Verify - Phase 0 live checklist"

# Brief §6 live verification, run from the GitHub runner against the public
# site with ?nocache=<ts>. Read-only. Run after the Phase 0 apply run.
# Home (57 / 772) footer social links are reported but NOT failed: Home is
# out of scope until Farshad approves a change there.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Live checks
        run: |
          BASE="https://lunacibarcelona.com"
          TS="$(date +%s)"
          FAIL=0
          mkdir -p pages

          fetch() { curl -sS -L -m 30 -A "Mozilla/5.0 (LUNACI phase0 verify)" "$BASE$1?nocache=$TS" -o "pages/$2.html"; }
          count() { grep -o -- "$2" "pages/$1.html" | wc -l | tr -d ' '; }
          expect_zero() {
            local n; n=$(count "$1" "$2")
            if [ "$n" = "0" ]; then echo "  PASS  $1: '$2' = 0"; else echo "  FAIL  $1: '$2' = $n"; FAIL=1; fi
          }
          expect_some() {
            local n; n=$(count "$1" "$2")
            if [ "$n" != "0" ]; then echo "  PASS  $1: '$2' present ($n)"; else echo "  FAIL  $1: '$2' missing"; FAIL=1; fi
          }

          fetch /contact/ contact_en
          fetch /es/contacto/ contact_es
          fetch /about-us/ about_en
          fetch /es/about-us-es/ about_es
          fetch / home_en
          fetch /es/ home_es
          for p in privacy-policy terms-of-service shipping returns es/politica-de-privacidad es/terminos-de-servicio es/envio es/devoluciones; do
            fetch "/$p/" "legal_$(echo "$p" | tr '/' '_')"
          done

          echo "== Contact (EN + ES) =="
          for pg in contact_en contact_es; do
            for s in xxxxxxx "Gracia 28" "Gracia+28" Atelier Flagship "538 663" "maps.google" "igsh=" Concierge ruelty crueldad "Middle East" "Oriente Medio"; do
              expect_zero "$pg" "$s"
            done
            for s in "+34 933 538 633" "tel:+34933538633" "wa.me/34745071014" "Patriotic Trade, S.L." "hero-title"; do
              expect_some "$pg" "$s"
            done
          done

          echo "== mailto: links (all fetched pages) =="
          BAD_MAILTO=$(grep -ohE 'mailto:[^"?]+' pages/*.html | sort -u | grep -v '^mailto:info@lunacibarcelona.com$' || true)
          if [ -z "$BAD_MAILTO" ]; then echo "  PASS  every mailto: -> info@lunacibarcelona.com"; else echo "  FAIL  other mailto targets: $BAD_MAILTO"; FAIL=1; fi

          echo "== Legal pages: lunaci.es = 0, entity =="
          for f in pages/legal_*.html; do
            pg=$(basename "$f" .html)
            expect_zero "$pg" "lunaci\.es"
            expect_zero "$pg" "Patriotic Trade Co\."
          done

          echo "== Footer social links (no href=\"#\") =="
          for pg in about_en about_es contact_en contact_es; do
            expect_zero "$pg" '<a href="#">IG</a>'
            expect_zero "$pg" '>TK<'
            expect_zero "$pg" '>PT<'
          done
          for pg in home_en home_es; do
            n=$(count "$pg" '<a href="#">')
            echo "  INFO  $pg: href=\"#\" links = $n (Home excluded by the hard rule; needs Farshad's approval)"
          done

          echo "== WooCommerce =="
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "$BASE/product/shadow/?nocache=$TS")
          if [ "$CODE" = "404" ]; then echo "  PASS  /product/shadow/ logged-out = 404"; else echo "  FAIL  /product/shadow/ logged-out = $CODE"; FAIL=1; fi
          curl -sS -m 30 "$BASE/wp-json/wc/store/v1/products?per_page=100&nocache=$TS" -o store.json
          if python3 -c "import json,sys; ids=[p['id'] for p in json.load(open('store.json'))]; print('  store API ids:', ids); sys.exit(515 in ids)"; then
            echo "  PASS  Store API does not return 515"
          else
            echo "  FAIL  Store API still returns 515"; FAIL=1
          fi

          echo "== Legacy static files =="
          for f in contact.html index.html products.html shop.html; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "$BASE/$f?nocache=$TS")
            if [ "$CODE" = "404" ]; then
              echo "  PASS  /$f = 404"
            else
              echo "  FAIL  /$f = HTTP $CODE (static file still served?)"; FAIL=1
            fi
          done

          echo ""
          if [ "$FAIL" = "0" ]; then echo "RESULT: ALL CHECKS PASSED"; else echo "RESULT: SOME CHECKS FAILED"; exit 1; fi
