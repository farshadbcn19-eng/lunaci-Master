name: Diagnose - verify live homepage SEO title/description (read-only)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Upload script and run (read-only)
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          set -e

          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            -P "$SSH_PORT" "assets/luna-import/verify-seo-title-live.sh" \
            "$SSH_USER@$SSH_HOST:/tmp/lunaimport-verify-seo-title-live.sh"

          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'bash /tmp/lunaimport-verify-seo-title-live.sh;
             STATUS=$?;
             rm -f /tmp/lunaimport-verify-seo-title-live.sh;
             exit $STATUS'
